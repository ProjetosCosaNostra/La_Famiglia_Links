name: "➕ Novo / Atualizar Produto (CMS)"
description: "Adiciona ou atualiza um produto em produtos.json."
title: "[CMS] Produto: "
labels: ["cms-produtos", "cms-novo-produto"]
body:
  - type: markdown
    attributes:
      value: |
        ✅ **Como usar (cadastro normal):**
        - Preencha os campos principais do produto.
        - Esse formulário é para **cadastro / atualização normal**.
        - **Pra imagem bonita (com QR):** arraste a imagem para dentro do texto do issue (ou cole a URL da imagem).
        - Ao enviar, a Action atualiza o `produtos.json` sozinha.

        ⚠️ **Importante:**
        - **Não use este formulário para relink, revisão manual ou manutenção de link morto.**
        - O fluxo de **relink / revisão** vai ficar em template separado.

        🧠 **Classificação canônica do produto:**
        - Defina a **categoria principal** do produto.
        - Se quiser, adicione **categorias secundárias**.
        - Você também pode informar **aliases de busca** para ajudar a loja a encontrar o produto com mais inteligência.
        - Isso reduz retrabalho e evita a vitrine depender só de inferência no front.

        🏛️ **Vitrine Rápida (home):**
        - A Vitrine Rápida agora trabalha com **até 12 posições** na home.
        - Você pode escolher se este produto deve aparecer nela.
        - Também pode definir a posição exata (**1 a 12**).
        - Se você ocupar uma posição já usada, este produto **substitui só aquela posição**.
        - O restante da estrutura da Vitrine Rápida permanece como está.
        - Se não marcar nada, o produto segue o fluxo normal da loja.

  - type: input
    id: sku
    attributes:
      label: "SKU (único)"
      description: "Ex: xiaomi-redmi-buds-6-play"
      placeholder: "xiaomi-redmi-buds-6-play"
    validations:
      required: true

  - type: input
    id: title
    attributes:
      label: "Título"
      placeholder: "Xiaomi Redmi Buds 6 Play"
    validations:
      required: true

  - type: input
    id: categoria_principal
    attributes:
      label: "Categoria Principal"
      description: "Ex: Tecnologia, Cuidado Pessoal, Moda & Acessórios, Casa & Cozinha"
      placeholder: "Tecnologia"
    validations:
      required: false

  - type: textarea
    id: categorias_secundarias
    attributes:
      label: "Categorias Secundárias (separe por vírgula)"
      description: "Ex: Notebook, PC, Armazenamento"
      placeholder: "Notebook, PC, Armazenamento"
    validations:
      required: false

  - type: textarea
    id: aliases_busca
    attributes:
      label: "Aliases de Busca (separe por vírgula)"
      description: "Termos alternativos para a busca encontrar melhor esse produto."
      placeholder: "ssd kingston, nvme 1tb, kingston nv3"
    validations:
      required: false

  - type: textarea
    id: badges
    attributes:
      label: "Badges/Tags (separe por vírgula)"
      description: "Ex: Achados do Dia, Bluetooth 5.4, TWS, PRETO"
      placeholder: "Achados do Dia, Bluetooth 5.4, TWS, PRETO"
    validations:
      required: false

  - type: input
    id: id_busca
    attributes:
      label: "ID Mercado Livre (pra colar na busca)"
      placeholder: "5J5PKG-E681"
    validations:
      required: false

  - type: input
    id: open_url
    attributes:
      label: "Link Mercado Livre (/sec/... ou equivalente)"
      placeholder: "https://mercadolivre.com/sec/2T9cpsU"
    validations:
      required: true

  - type: input
    id: image_url
    attributes:
      label: "Imagem (URL opcional)"
      description: "Se você não preencher, o sistema pega automaticamente a primeira imagem colada/arrastada no corpo do issue."
      placeholder: "https://... (opcional)"
    validations:
      required: false

  - type: checkboxes
    id: flags
    attributes:
      label: "Opções"
      description: "Você escolhe (não é automático)."
      options:
        - label: "Ativo (aparece na vitrine)"
          required: false
        - label: "Definir como Produto do Dia (featured)"
          required: false
        - label: "Colocar este produto na Vitrine Rápida"
          required: false

  - type: input
    id: quick_home_order
    attributes:
      label: "Posição na Vitrine Rápida (opcional)"
      description: "Ex.: 1 a 12. Se você informar uma posição já ocupada, este produto substitui só aquela posição e o restante da estrutura permanece."
      placeholder: "1"
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ## 📎 Upload da imagem bonita (com QR)
        **Depois de preencher os campos**, você pode arrastar a imagem aqui embaixo no corpo do issue:
        - Arraste e solte (ou cole) a imagem.
        - O GitHub vai gerar um link público.
        - O CMS vai pegar automaticamente.

  - type: textarea
    id: uploads
    attributes:
      label: "Cole/arraste a imagem aqui (opcional)"
      description: "Pode deixar vazio se já colocou a imagem em outro lugar no issue."
      placeholder: "Arraste a imagem aqui…"
    validations:
      required: false
