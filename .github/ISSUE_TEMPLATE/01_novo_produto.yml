name: "➕ Novo / Atualizar Produto (CMS)"
description: "Adiciona ou atualiza um produto em produtos.json com suporte a revisão manual, relink e manutenção."
title: "[CMS] Produto: "
labels: ["cms-produtos", "cms-novo-produto"]
body:
  - type: markdown
    attributes:
      value: |
        ✅ **Como usar (do jeito certo):**
        - Preencha os campos principais do produto.
        - Use **Ação manual** quando o item precisar entrar em revisão, relink ou desativação manual.
        - **Pra imagem bonita (com QR):** arraste a imagem para dentro do texto do issue (ou cole a URL da imagem).
        - Ao enviar, a Action atualiza o `produtos.json` sozinha.

        ✅ **Fluxo recomendado para produto com link morto**
        1. Marque **Ação manual = Produto precisa de relink**
        2. Explique o motivo em **Motivo / problema encontrado**
        3. Preencha **Novo vendedor / observação** e **Novo Link Mercado Livre**
        4. Quando o novo link estiver bom, troque para **Reativar produto com este issue**

  - type: input
    id: sku
    attributes:
      label: "SKU (único)"
      description: "Ex: xiaomi-redmi-buds-6-play"
      placeholder: "xiaomi-redmi-buds-6-play"
    validations:
      required: true

  - type: input
    id: title
    attributes:
      label: "Título"
      placeholder: "Xiaomi Redmi Buds 6 Play"
    validations:
      required: true

  - type: textarea
    id: badges
    attributes:
      label: "Badges/Tags (separe por vírgula)"
      description: "Ex: Achados do Dia, Bluetooth 5.4, TWS, PRETO"
      placeholder: "Achados do Dia, Bluetooth 5.4, TWS, PRETO"
    validations:
      required: false

  - type: input
    id: id_busca
    attributes:
      label: "ID Mercado Livre (pra colar na busca)"
      placeholder: "5J5PKG-E681"
    validations:
      required: false

  - type: input
    id: open_url
    attributes:
      label: "Link Mercado Livre (principal /sec/... ou meli.la)"
      placeholder: "https://mercadolivre.com/sec/2T9cpsU"
    validations:
      required: true

  - type: input
    id: image_url
    attributes:
      label: "Imagem (URL opcional)"
      description: "Se você não preencher, o sistema pega automaticamente a primeira imagem colada/arrastada no corpo do issue."
      placeholder: "https://... (opcional)"
    validations:
      required: false

  - type: dropdown
    id: review_action
    attributes:
      label: "Ação manual"
      description: "Escolha o que este issue deve fazer com o produto."
      options:
        - "Manter / atualizar normalmente"
        - "Produto precisa de relink"
        - "Reativar produto com este issue"
        - "Desativar manualmente"
    validations:
      required: true

  - type: dropdown
    id: review_status
    attributes:
      label: "Status de revisão / manutenção"
      description: "Campo operacional para acompanhar o estado do produto."
      options:
        - "Ativo / normal"
        - "Em revisão"
        - "Precisa relink"
        - "Desativado manual"
    validations:
      required: false

  - type: textarea
    id: review_reason
    attributes:
      label: "Motivo / problema encontrado"
      description: "Ex: link caiu em /social/, vendedor sem estoque, anúncio removido, preço ficou ruim."
      placeholder: "Explique aqui por que este produto precisa revisão, relink ou desativação."
    validations:
      required: false

  - type: input
    id: replacement_vendor
    attributes:
      label: "Novo vendedor / observação"
      description: "Ex: loja oficial X, vendedor com 10mil vendas, melhor reputação."
      placeholder: "Novo vendedor / observação"
    validations:
      required: false

  - type: input
    id: relink_open_url
    attributes:
      label: "Novo Link Mercado Livre (relink opcional)"
      description: "Se você já achou outro vendedor/anúncio, cole aqui. Quando preenchido, ele passa a ser o link principal."
      placeholder: "https://mercadolivre.com/sec/... ou https://meli.la/..."
    validations:
      required: false

  - type: input
    id: manual_check_url
    attributes:
      label: "check_url manual (opcional)"
      description: "Use só se quiser forçar um check_url específico."
      placeholder: "https://mercadolivre.com/... (opcional)"
    validations:
      required: false

  - type: input
    id: manual_canonical_url
    attributes:
      label: "canonical_url manual (opcional)"
      description: "Use só se quiser forçar uma canonical_url específica."
      placeholder: "https://lista.mercadolivre.com.br/... (opcional)"
    validations:
      required: false

  - type: input
    id: alt_url
    attributes:
      label: "Link alternativo / fallback (opcional)"
      description: "Ex: link da bio, landing auxiliar, outra página estável."
      placeholder: "https://... (opcional)"
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: "Observações internas / notas de relink"
      description: "Campo livre para anotações de manutenção."
      placeholder: "Anotações internas, histórico do relink, motivo da troca, observações operacionais..."
    validations:
      required: false

  - type: checkboxes
    id: flags
    attributes:
      label: "Opções"
      description: "Você escolhe (não é automático)."
      options:
        - label: "Ativo (aparece na vitrine)"
          required: false
        - label: "Definir como Produto do Dia (featured)"
          required: false

  - type: markdown
    attributes:
      value: |
        ## 📎 Upload da imagem bonita (com QR)
        **Depois de preencher os campos**, você pode arrastar a imagem aqui embaixo no corpo do issue:
        - Arraste e solte (ou cole) a imagem.
        - O GitHub vai gerar um link público.
        - O CMS vai pegar automaticamente.

  - type: textarea
    id: uploads
    attributes:
      label: "Cole/arraste a imagem aqui (opcional)"
      description: "Pode deixar vazio se já colocou a imagem em outro lugar no issue."
      placeholder: "Arraste a imagem aqui…"
    validations:
      required: false
