name: "➕ Novo / Atualizar Produto (CMS)"
description: "Adiciona ou atualiza um produto em produtos.json."
title: "[CMS] Produto: "
labels: ["cms-produtos", "cms-novo-produto"]
body:
  - type: markdown
    attributes:
      value: |
        ✅ **Como usar (cadastro normal):**
        - Preencha os campos principais do produto.
        - Esse formulário é para **cadastro / atualização normal**.
        - A **descrição curta** agora é campo importante: ela aparece no modal/detalhes e evita produto sem texto comercial.
        - Em **Badges/Tags/Hashtags**, coloque também os benefícios principais para a busca e para as hashtags automáticas.
        - A foto limpa do card do site novo é buscada e preparada automaticamente.
        - A arte com QR continua opcional e pode ser usada nas redes sociais sem poluir o card da loja.
        - Ao enviar, a Action atualiza o `produtos.json` sozinha.

        ⚠️ **Importante:**
        - **Não use este formulário para relink, revisão manual ou manutenção de link morto.**
        - O fluxo de **relink / revisão** vai ficar em template separado.

        🧠 **Classificação canônica do produto:**
        - Defina a **categoria principal** do produto.
        - Se quiser, adicione **categorias secundárias**.
        - Você também pode informar **aliases de busca** para ajudar a loja a encontrar o produto com mais inteligência.
        - Isso reduz retrabalho e evita a vitrine depender só de inferência no front.

        🏛️ **Vitrine Rápida (home):**
        - A Vitrine Rápida agora trabalha com **até 12 posições** na home.
        - Você pode escolher se este produto deve aparecer nela.
        - Também pode definir a posição exata (**1 a 12**).
        - Se você ocupar uma posição já usada, este produto **substitui só aquela posição**.
        - O restante da estrutura da Vitrine Rápida permanece como está.
        - Se não marcar nada, o produto segue o fluxo normal da loja.

  - type: input
    id: sku
    attributes:
      label: "SKU (único)"
      description: "Ex: xiaomi-redmi-buds-6-play"
      placeholder: "xiaomi-redmi-buds-6-play"
    validations:
      required: true

  - type: input
    id: title
    attributes:
      label: "Título"
      placeholder: "Xiaomi Redmi Buds 6 Play"
    validations:
      required: true

  - type: input
    id: categoria_principal
    attributes:
      label: "Categoria Principal"
      description: "A loja nova é exclusiva de beleza feminina. Ex.: Maquiagem, Skincare, Cabelo, Perfumaria ou Acessórios Femininos."
      placeholder: "Beleza e Cuidado Pessoal"
    validations:
      required: true

  - type: textarea
    id: categorias_secundarias
    attributes:
      label: "Categorias Secundárias (separe por vírgula)"
      description: "Ex.: Maquiagem, Lábios, Gloss ou Skincare, Hidratação, Pele"
      placeholder: "Maquiagem, Lábios, Gloss"
    validations:
      required: false

  - type: textarea
    id: aliases_busca
    attributes:
      label: "Aliases de Busca (separe por vírgula)"
      description: "Termos alternativos para a busca encontrar melhor esse produto."
      placeholder: "ssd kingston, nvme 1tb, kingston nv3"
    validations:
      required: false

  - type: textarea
    id: badges
    attributes:
      label: "Badges/Tags/Hashtags (separe por vírgula)"
      description: "Use aqui categorias, benefícios e palavras para hashtags automáticas. Ex: Achados do Dia, Beleza, Skincare, Água Micelar, Textura Não Oleosa, Frete Grátis"
      placeholder: "Achados do Dia, Beleza, Skincare, Água Micelar, Textura Não Oleosa, Frete Grátis"
    validations:
      required: false

  - type: textarea
    id: promo_text
    attributes:
      label: "Descrição curta / texto promocional do produto"
      description: "Texto comercial curto para aparecer no modal/detalhes e para reaproveitar em redes sociais. Evite texto longo."
      placeholder: "💧 Água Micelar Garnier SkinActive Tudo em 1 — 400ml. Limpa, demaquila, hidrata e suaviza em um só passo. Ideal para todos os tipos de pele, com textura não oleosa e uso no rosto, olhos e lábios."
    validations:
      required: true

  - type: input
    id: id_busca
    attributes:
      label: "ID Mercado Livre (pra colar na busca)"
      placeholder: "5J5PKG-E681"
    validations:
      required: false

  - type: input
    id: open_url
    attributes:
      label: "Link Mercado Livre (/sec/... ou equivalente)"
      placeholder: "https://mercadolivre.com/sec/2T9cpsU"
    validations:
      required: true

  - type: input
    id: image_url
    attributes:
      label: "Arte promocional / redes sociais (URL opcional)"
      description: "Opcional e separada da foto limpa do card, que o sistema busca sozinho."
      placeholder: "https://... (opcional; pode ter QR)"
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ## 💰 Preço / Oferta para campanha (opcional)
        Use estes campos principalmente no **Produto do Dia** ou produto impulsionado.
        A descrição curta fica mais acima, antes do preço, para não faltar texto no produto.
        Se deixar vazio, a loja mantém o comportamento atual.

  - type: input
    id: price_text
    attributes:
      label: "Preço atual"
      description: "Ex.: R$ 139,90. Use somente quando quiser destacar preço no card."
      placeholder: "R$ 139,90"
    validations:
      required: false

  - type: input
    id: old_price_text
    attributes:
      label: "Preço anterior / preço de"
      description: "Ex.: R$ 189,90. Opcional."
      placeholder: "R$ 189,90"
    validations:
      required: false

  - type: input
    id: discount_text
    attributes:
      label: "Desconto / selo da oferta"
      description: "Ex.: 24% OFF, Oferta do Dia, Preço em destaque."
      placeholder: "24% OFF"
    validations:
      required: false

  - type: input
    id: price_checked_at
    attributes:
      label: "Preço conferido em"
      description: "Data ou observação curta para lembrar que o preço pode mudar no Mercado Livre."
      placeholder: "11/05/2026"
    validations:
      required: false

  - type: input
    id: buy_cta
    attributes:
      label: "CTA de compra / texto do botão"
      description: "Opcional. Ex.: Comprar com desconto no Mercado Livre"
      placeholder: "Comprar com desconto no Mercado Livre"
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ## 🖼️ Galeria / carrossel de imagens do produto (opcional)
        Cole uma URL por linha. A primeira imagem principal continua sendo o campo **Imagem** acima.
        Use aqui as imagens extras para o usuário navegar por setas na loja.

  - type: textarea
    id: gallery_images
    attributes:
      label: "Imagens extras / Galeria de imagens"
      description: "Cole uma URL por linha. Também aceita imagens arrastadas/coladas no corpo deste campo."
      placeholder: |
        https://github.com/user-attachments/assets/imagem-2
        https://github.com/user-attachments/assets/imagem-3
    validations:
      required: false

  - type: checkboxes
    id: flags
    attributes:
      label: "Opções"
      description: "Você escolhe (não é automático)."
      options:
        - label: "Ativo (aparece na vitrine)"
          required: false
        - label: "Definir como Produto do Dia (featured)"
          required: false
        - label: "Colocar este produto na Vitrine Rápida"
          required: false

  - type: input
    id: quick_home_order
    attributes:
      label: "Posição na Vitrine Rápida (opcional)"
      description: "Ex.: 1 a 12. Se você informar uma posição já ocupada, este produto substitui só aquela posição e o restante da estrutura permanece."
      placeholder: "1"
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ## 📎 Arte opcional para redes sociais (com QR)
        A foto limpa do produto usada no site é automática. Você não precisa
        recadastrar nem preparar uma segunda imagem para a vitrine.

        **Depois de preencher os campos**, você pode arrastar a imagem aqui embaixo no corpo do issue:
        - Arraste e solte (ou cole) a imagem.
        - O GitHub vai gerar um link público.
        - O CMS vai pegar automaticamente.

  - type: textarea
    id: uploads
    attributes:
      label: "Cole/arraste a imagem aqui (opcional)"
      description: "Pode deixar vazio se já colocou a imagem em outro lugar no issue."
      placeholder: "Arraste a imagem aqui…"
    validations:
      required: false
