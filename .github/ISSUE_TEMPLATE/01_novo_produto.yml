name: "📦 Novo produto (Vitrine)"
description: "Adicionar/atualizar um produto no produtos.json (sem editar arquivo na mão)."
title: "[CMS] Novo produto: "
labels: ["cms:novo-produto"]
body:
  - type: markdown
    attributes:
      value: |
        ## CMS — Novo Produto (Vitrine)
        ✅ Preencha os campos e, se quiser, **anexe a imagem** (arraste e solte aqui na descrição depois de criar).
        ✅ Se marcar **Produto do Dia**, ele vira o destaque da Home e os outros deixam de ser Produto do Dia.

  - type: input
    id: sku
    attributes:
      label: "SKU (único)"
      description: "Ex: fone-redmi-buds-6-play"
      placeholder: "ex: mochila-impermeavel-notebook-15-6"
    validations:
      required: true

  - type: input
    id: title
    attributes:
      label: "Título"
      placeholder: "Ex: Xiaomi Redmi Buds 6 Play — Bluetooth 5.4"
    validations:
      required: true

  - type: input
    id: id_busca
    attributes:
      label: "ID de Busca (Mercado Livre)"
      description: "Ex: 5J5PKG-E681"
      placeholder: "ex: 5J5PKG-E681"
    validations:
      required: true

  - type: input
    id: open_url
    attributes:
      label: "Link /sec/ (Mercado Livre)"
      description: "Ex: https://mercadolivre.com/sec/2T9cpsU"
      placeholder: "https://mercadolivre.com/sec/XXXXXXXX"
    validations:
      required: true

  - type: input
    id: image
    attributes:
      label: "Imagem (opcional)"
      description: "Se você colar uma URL aqui, o CMS usa ela. Se deixar vazio, o CMS tenta pegar do anexo da issue (imagem que você arrastar aqui)."
      placeholder: "https://... (ou deixe vazio e anexe a imagem na issue)"
    validations:
      required: false

  - type: input
    id: badges
    attributes:
      label: "Badges (separado por vírgula)"
      placeholder: "Achados do Dia, Bluetooth 5.4, TWS, Preto"
    validations:
      required: false

  - type: input
    id: price_text
    attributes:
      label: "Preço (texto opcional)"
      placeholder: "Ex: R$ 100,55 (36% OFF)"
    validations:
      required: false

  - type: dropdown
    id: active
    attributes:
      label: "Ativo na vitrine?"
      options:
        - "true"
        - "false"
    validations:
      required: true

  - type: checkboxes
    id: featured
    attributes:
      label: "Produto do Dia"
      options:
        - label: "Definir como Produto do Dia (destaque na Home)"
          required: false

  - type: markdown
    attributes:
      value: |
        ### ✅ Importante sobre imagem
        Depois que a issue for criada, você pode:
        - **Arrastar e soltar** a imagem aqui na descrição/comentário; o GitHub vai gerar uma URL pública.
        - O CMS vai usar automaticamente a **primeira URL de imagem** que encontrar (se você não preencher o campo 'Imagem').
