name: "⭐ Definir Produto do Dia (featured)"
description: "Escolha manualmente qual SKU vira o Produto do Dia."
title: "[CMS] Produto do Dia: "
labels: ["cms-produtos", "cms-produto-do-dia"]
body:
  - type: markdown
    attributes:
      value: |
        ✅ Você escolhe manualmente qual SKU vira **Produto do Dia**.
        - Isso **desmarca os outros** (fica só 1 featured).

  - type: input
    id: sku
    attributes:
      label: "SKU para virar Produto do Dia"
      placeholder: "mochila-impermeavel-notebook-15-6"
    validations:
      required: true


  - type: markdown
    attributes:
      value: |
        ## 💰 Preço / Oferta do Produto do Dia (opcional)
        Use quando o produto impulsionado precisar exibir preço, preço antigo e desconto na loja.

  - type: input
    id: price_text
    attributes:
      label: "Preço atual"
      placeholder: "R$ 139,90"
    validations:
      required: false

  - type: input
    id: old_price_text
    attributes:
      label: "Preço anterior / preço de"
      placeholder: "R$ 189,90"
    validations:
      required: false

  - type: input
    id: discount_text
    attributes:
      label: "Desconto / selo da oferta"
      placeholder: "24% OFF"
    validations:
      required: false

  - type: input
    id: price_checked_at
    attributes:
      label: "Preço conferido em"
      placeholder: "11/05/2026"
    validations:
      required: false

  - type: textarea
    id: promo_text
    attributes:
      label: "Texto promocional / observação do preço"
      placeholder: "Preço conferido no Mercado Livre. Pode mudar sem aviso."
    validations:
      required: false

  - type: input
    id: buy_cta
    attributes:
      label: "CTA de compra / texto do botão"
      placeholder: "Comprar com desconto no Mercado Livre"
    validations:
      required: false

  - type: checkboxes
    id: opts
    attributes:
      label: "Opções"
      options:
        - label: "Se o SKU não existir, criar mesmo assim (com título vazio) — NÃO recomendado"
          required: false
