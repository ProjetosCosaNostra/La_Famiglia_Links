name: "✏️ Editar Produto Existente (CMS)"
description: "Escolha o produto já existente pela issue original + SKU e edite só os campos principais."
title: "[CMS] Editar Produto: "
labels: ["cms-produtos", "cms-editar-produto"]
body:
  - type: markdown
    attributes:
      value: |
        ✅ **Como usar (edição simplificada):**
        - Este formulário é para **editar um produto que já existe**.
        - Você informa a **issue original** e o **SKU** do produto.
        - Aqui ficam só os **campos principais**, no mesmo estilo do formulário de cadastro.
        - Preencha **apenas o que quer mudar**. O resto permanece como está.

        ⚠️ **Importante:**
        - O GitHub **não consegue puxar uma lista viva de produtos/issues** dentro do formulário.
        - Então a forma segura é escolher por **Número da issue original** + **SKU**.
        - Para cadastro novo, continue usando **Novo / Atualizar Produto (CMS)**.

  - type: input
    id: target_issue_number
    attributes:
      label: "Número da issue original do produto"
      description: "Ex.: 112"
      placeholder: "112"
    validations:
      required: true

  - type: input
    id: sku
    attributes:
      label: "SKU do produto que já existe"
      description: "Precisa ser o SKU já cadastrado em produtos.json"
      placeholder: "tradutor-inteligente-premium-online-offline"
    validations:
      required: true

  - type: input
    id: title
    attributes:
      label: "Novo título (opcional)"
      description: "Deixe vazio para manter o título atual."
      placeholder: "Novo título do produto"
    validations:
      required: false

  - type: textarea
    id: badges
    attributes:
      label: "Novas badges/tags (opcional)"
      description: "Deixe vazio para manter as badges atuais."
      placeholder: "Achados do Dia, Tecnologia, Premium"
    validations:
      required: false

  - type: input
    id: id_busca
    attributes:
      label: "Novo ID Mercado Livre (opcional)"
      description: "Deixe vazio para manter o ID atual."
      placeholder: "5J5PKG-T25W"
    validations:
      required: false

  - type: input
    id: open_url
    attributes:
      label: "Novo Link Mercado Livre principal (opcional)"
      description: "Se preencher, este vira o link principal do produto."
      placeholder: "https://mercadolivre.com/sec/... ou https://meli.la/..."
    validations:
      required: false

  - type: input
    id: image_url
    attributes:
      label: "Nova imagem (URL opcional)"
      description: "Deixe vazio para manter a imagem atual."
      placeholder: "https://... (opcional)"
    validations:
      required: false

  - type: checkboxes
    id: options
    attributes:
      label: "Opções (opcional)"
      description: "Marque só se quiser forçar mudança nessas opções."
      options:
        - label: "Ativo (aparece na vitrine)"
        - label: "Definir como Produto do Dia (featured)"

  - type: markdown
    attributes:
      value: |
        🖼️ **Upload da imagem bonita (com QR)**
        - Se não quiser colar URL no campo de imagem, você pode arrastar a imagem no corpo da issue.
        - O GitHub vai gerar um link público.
        - O CMS pode usar essa imagem no produto.

  - type: textarea
    id: image_dropzone
    attributes:
      label: "Cole/arraste a imagem aqui (opcional)"
      description: "Pode deixar vazio se já preencheu a URL da imagem acima."
      placeholder: "Arraste a imagem aqui..."
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        📌 **Resultado esperado:**
        - este issue atualiza o produto no `produtos.json`
        - usando só os campos principais
        - sem aquele monte de campo de manutenção que atrapalha
