name: "✏️ Editar Produto Existente (CMS)"
description: "Escolha o produto já existente pela issue original + SKU e edite só os campos principais."
title: "[CMS] Editar Produto: "
labels: ["cms-produtos", "cms-editar-produto"]
body:
  - type: markdown
    attributes:
      value: |
        ✅ **Como usar (edição simplificada):**
        - Este formulário é para **editar um produto que já existe**.
        - Você informa a **issue original** e o **SKU** do produto.
        - Aqui ficam só os **campos principais**, no mesmo estilo do formulário de cadastro.
        - Preencha **apenas o que quer mudar**. O resto permanece como está.

        ⚠️ **Importante:**
        - O GitHub **não consegue puxar uma lista viva de produtos/issues** dentro do formulário.
        - Então a forma segura é escolher por **Número da issue original** + **SKU**.
        - Para cadastro novo, continue usando **Novo / Atualizar Produto (CMS)**.

        🧠 **Classificação canônica do produto:**
        - Se quiser melhorar a inteligência da loja, você pode ajustar a **categoria principal**.
        - Também pode definir **categorias secundárias** e **aliases de busca**.
        - Isso reduz retrabalho, melhora a busca e evita a vitrine depender só de inferência no front.

        🏛️ **Vitrine Rápida (home):**
        - A Vitrine Rápida agora trabalha com **até 12 posições**.
        - Aqui você pode **manter**, **colocar/atualizar** ou **remover** o produto da Vitrine Rápida.
        - Se você informar uma posição já ocupada, este produto **substitui só aquela posição**.
        - O restante da estrutura da Vitrine Rápida permanece como está.

  - type: input
    id: target_issue_number
    attributes:
      label: "Número da issue original do produto"
      description: "Ex.: 112"
      placeholder: "112"
    validations:
      required: true

  - type: input
    id: sku
    attributes:
      label: "SKU do produto que já existe"
      description: "Precisa ser o SKU já cadastrado em produtos.json"
      placeholder: "tradutor-inteligente-premium-online-offline"
    validations:
      required: true

  - type: input
    id: title
    attributes:
      label: "Novo título (opcional)"
      description: "Deixe vazio para manter o título atual."
      placeholder: "Novo título do produto"
    validations:
      required: false

  - type: input
    id: categoria_principal
    attributes:
      label: "Nova Categoria Principal (opcional)"
      description: "Deixe vazio para manter a categoria principal atual."
      placeholder: "Tecnologia"
    validations:
      required: false

  - type: textarea
    id: categorias_secundarias
    attributes:
      label: "Novas Categorias Secundárias (opcional)"
      description: "Separe por vírgula. Deixe vazio para manter as categorias secundárias atuais."
      placeholder: "Notebook, PC, Armazenamento"
    validations:
      required: false

  - type: textarea
    id: aliases_busca
    attributes:
      label: "Novos Aliases de Busca (opcional)"
      description: "Termos alternativos para a busca encontrar melhor esse produto."
      placeholder: "ssd kingston, nvme 1tb, kingston nv3"
    validations:
      required: false

  - type: textarea
    id: badges
    attributes:
      label: "Novas badges/tags (opcional)"
      description: "Deixe vazio para manter as badges atuais."
      placeholder: "Achados do Dia, Tecnologia, Premium"
    validations:
      required: false

  - type: input
    id: id_busca
    attributes:
      label: "Novo ID Mercado Livre (opcional)"
      description: "Deixe vazio para manter o ID atual."
      placeholder: "5J5PKG-T25W"
    validations:
      required: false

  - type: input
    id: open_url
    attributes:
      label: "Novo Link Mercado Livre principal (opcional)"
      description: "Se preencher, este vira o link principal do produto."
      placeholder: "https://mercadolivre.com/sec/... ou https://meli.la/..."
    validations:
      required: false

  - type: input
    id: image_url
    attributes:
      label: "Nova imagem (URL opcional)"
      description: "Deixe vazio para manter a imagem atual."
      placeholder: "https://... (opcional)"
    validations:
      required: false

  - type: dropdown
    id: quick_home_action
    attributes:
      label: "Ação da Vitrine Rápida (opcional)"
      description: "Escolha se quer manter, colocar/atualizar ou remover este produto da Vitrine Rápida."
      options:
        - "Manter como está"
        - "Colocar / manter na Vitrine Rápida"
        - "Remover da Vitrine Rápida"
    validations:
      required: false

  - type: input
    id: quick_home_order
    attributes:
      label: "Posição na Vitrine Rápida (opcional)"
      description: "Ex.: 1 a 12. Se informar uma posição já ocupada, este produto substitui só aquela posição e o restante permanece."
      placeholder: "1"
    validations:
      required: false

  - type: dropdown
    id: active_action
    attributes:
      label: "Estado do produto (opcional)"
      description: "Use só se quiser forçar ativação ou desativação do produto."
      options:
        - "Manter como está"
        - "Ativar produto"
        - "Desativar produto"
    validations:
      required: false

  - type: dropdown
    id: featured_action
    attributes:
      label: "Produto do Dia / Featured (opcional)"
      description: "Use só se quiser forçar mudança nessa opção. Para fluxo dedicado, continue usando o template de Produto do Dia."
      options:
        - "Manter como está"
        - "Definir como Produto do Dia (featured)"
        - "Remover como Produto do Dia (featured)"
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        🖼️ **Upload da imagem bonita (com QR)**
        - Se não quiser colar URL no campo de imagem, você pode arrastar a imagem no corpo da issue.
        - O GitHub vai gerar um link público.
        - O CMS pode usar essa imagem no produto.

  - type: textarea
    id: image_dropzone
    attributes:
      label: "Cole/arraste a imagem aqui (opcional)"
      description: "Pode deixar vazio se já preencheu a URL da imagem acima."
      placeholder: "Arraste a imagem aqui..."
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        📌 **Resultado esperado:**
        - este issue atualiza o produto no `produtos.json`
        - usando só os campos principais
        - sem aquele monte de campo de manutenção que atrapalha
        - agora também pode definir **categoria principal**, **categorias secundárias** e **aliases de busca**
        - pode **colocar, reposicionar ou remover** o produto da **Vitrine Rápida**
        - e, se quiser, também pode ajustar **estado do produto** e **Produto do Dia**
