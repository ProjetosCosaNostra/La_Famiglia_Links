name: Backfill Issue Links (produtos.json)

on:
  workflow_dispatch: {}

permissions:
  contents: write
  issues: read

jobs:
  backfill-issue-links:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (gh-pages)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Backfill
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python tools/backfill_issue_links.py

      - name: Validate produtos.json
        run: |
          test -f produtos.json
          python -m json.tool produtos.json >/dev/null

      - name: Commit & push (if changed)
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add produtos.json tools/backfill_issue_links.py .github/workflows/backfill_issue_links.yml
            git commit -m "chore: backfill issue links in produtos.json"
            git push origin gh-pages
          else
            echo "No changes."
          fi
