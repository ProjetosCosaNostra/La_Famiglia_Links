name: BlackGold Exact Authority Gate

on:
  push:
    branches:
      - blackgold-beauty-finds-novo-authority
    paths:
      - "blackgold-beauty-finds-novo/**"
      - ".github/workflows/blackgold-authority-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --disable-pip-version-check pillow

      - name: Canonical source lock
        run: |
          python - <<'PY'
          from pathlib import Path
          r=Path("blackgold-beauty-finds-novo")
          obsolete=[
            "authority-desktop-v26.webp",
            "authority-mobile-v24.webp",
            "shell.css",
            "shell.js",
          ]
          found=[name for name in obsolete if (r/name).exists()]
          assert not found, "obsolete visual sources reintroduced: "+", ".join(found)
          verify=(r/"tools/verify.ps1").read_text(encoding="utf-8")
          assert "assets\\authority-zero-desktop.png" in verify
          assert "assets\\authority-zero-mobile.png" in verify
          assert "capture_visual.mjs" in verify
          assert "explicitViewportCapture" in verify
          assert (r/"tools/capture_visual.mjs").exists()
          print("BLACKGOLD_CANONICAL_SOURCE_LOCK=PASS")
          PY

      - name: Verify pinned authority assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          r=Path("blackgold-beauty-finds-novo")
          m=json.loads((r/"assets/authority-zero-manifest.json").read_text())
          assert m["desktop"]["approvedSha256"]=="5e3e6cef8f0f5e14bde52b5c9f0be9ae9c1d92fd771f3e424b9cf75fbb59f722"
          assert m["mobile"]["approvedSha256"]=="afb0937f38d2c633cf7ebe40e4a789e8fc8b84bb746e28e0e6b1441779bca2ed"
          assert hashlib.sha256((r/"assets/authority-zero-desktop.png").read_bytes()).hexdigest()==m["desktop"]["zeroSha256"]
          assert hashlib.sha256((r/"assets/authority-zero-mobile.png").read_bytes()).hexdigest()==m["mobile"]["zeroSha256"]
          print("BLACKGOLD_PINNED_AUTHORITY=PASS")
          PY

      - name: Derive approved product geometry
        run: |
          python blackgold-beauty-finds-novo/tools/authority_product_geometry.py             --approved cloudflare-beauty-finds/visual-authority/BLACKGOLD_HOME_DESKTOP_MOCKUP_APPROVED_20260909_140134.png             --zero blackgold-beauty-finds-novo/assets/authority-zero-desktop.png             --report blackgold-beauty-finds-novo/.visual-gate/authority-product-geometry.json

      - name: Start static authority server
        run: |
          python -m http.server 8799 --bind 127.0.0.1 --directory blackgold-beauty-finds-novo >/tmp/bg-static.log 2>&1 &
          sleep 2
          curl --fail http://127.0.0.1:8799/ >/dev/null

      - name: Locate Chrome
        id: chrome
        run: |
          BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$BIN"
          echo "bin=$BIN" >> "$GITHUB_OUTPUT"

      - name: Capture legacy approved-product implementation for internal calibration
        run: |
          python -m http.server 8798 --bind 127.0.0.1 --directory . >/tmp/bg-legacy-static.log 2>&1 &
          sleep 2
          "${{ steps.chrome.outputs.bin }}" --headless=new --disable-gpu --no-sandbox --hide-scrollbars --virtual-time-budget=1800 --force-device-scale-factor=1 --window-size=1448,1086 --screenshot=blackgold-beauty-finds-novo/.visual-gate/legacy-approved-products.png http://127.0.0.1:8798/cloudflare-beauty-finds/
          python blackgold-beauty-finds-novo/tools/product_region_diagnostic.py             --authority cloudflare-beauty-finds/visual-authority/BLACKGOLD_HOME_DESKTOP_MOCKUP_APPROVED_20260909_140134.png             --candidate blackgold-beauty-finds-novo/.visual-gate/legacy-approved-products.png             --report blackgold-beauty-finds-novo/.visual-gate/legacy-product-region-diagnostic.json

      - name: Capture exact desktop and mobile
        run: |
          mkdir -p blackgold-beauty-finds-novo/.visual-gate
          "${{ steps.chrome.outputs.bin }}" --headless=new --disable-gpu --no-sandbox --hide-scrollbars --force-device-scale-factor=1 --window-size=1448,1086 --screenshot=blackgold-beauty-finds-novo/.visual-gate/desktop.png http://127.0.0.1:8799/
          "${{ steps.chrome.outputs.bin }}" --headless=new --disable-gpu --no-sandbox --hide-scrollbars --force-device-scale-factor=1 --window-size=310,896 --screenshot=blackgold-beauty-finds-novo/.visual-gate/mobile.png http://127.0.0.1:8799/

      - name: Exact desktop gate
        run: |
          python blackgold-beauty-finds-novo/tools/visual_gate.py --authority blackgold-beauty-finds-novo/assets/authority-zero-desktop.png --candidate blackgold-beauty-finds-novo/.visual-gate/desktop.png --report blackgold-beauty-finds-novo/.visual-gate/desktop.json

      - name: Exact mobile gate
        run: |
          python blackgold-beauty-finds-novo/tools/visual_gate.py --authority blackgold-beauty-finds-novo/assets/authority-zero-mobile.png --candidate blackgold-beauty-finds-novo/.visual-gate/mobile.png --report blackgold-beauty-finds-novo/.visual-gate/mobile.json

      - name: Wide-screen fill gate
        run: |
          DOM="$("${{ steps.chrome.outputs.bin }}" --headless=new --disable-gpu --no-sandbox --hide-scrollbars --virtual-time-budget=1500 --window-size=1919,960 --dump-dom http://127.0.0.1:8799/ 2>/tmp/bg-wide.log)"
          echo "$DOM" | grep -q 'data-render-width="1919"'
          echo "$DOM" | grep -q 'data-viewport-width="1919"'
          echo "$DOM" | grep -q 'data-horizontal-overflow="false"'
          echo "BLACKGOLD_WIDE_FILL=PASS"

      - name: Zero catalog and release guards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=Path("blackgold-beauty-finds-novo")
          text=(r/"index.html").read_text()+(r/"app.js").read_text()
          forbidden=["Miss Dior","Dior Saddle","R$ 649,90","193 produtos ativos"]
          assert not [x for x in forbidden if x in text]
          g=json.loads((r/"preview-guard.json").read_text())
          assert g["catalogInitialCount"]==0
          assert g["previewAutoOpenAllowed"] is False
          assert g["productionDeployAllowed"] is False
          assert g["productFootprintGateRequired"] is True
          assert g["previewRequiresProductFootprintGatePass"] is True
          assert g["productRegionPixelDiagnosticCanApprove"] is False
          assert g["productFootprintContract"]=="BLACKGOLD_APPROVED_PRODUCT_FOOTPRINT_GATE_V1"
          print("BLACKGOLD_ZERO_AND_RELEASE_GUARDS=PASS")
          PY

      - name: Search metadata and crawler privacy gate
        run: |
          python - <<'PY'
          from pathlib import Path
          r=Path("blackgold-beauty-finds-novo")
          html=(r/"index.html").read_text(encoding="utf-8")
          robots=(r/"robots.txt").read_text(encoding="utf-8")
          assert 'name="description"' in html
          assert 'property="og:image"' in html
          assert 'name="twitter:card"' in html
          assert "Disallow: /admin.html" in robots
          assert "Disallow: /api/admin/" in robots
          assert "Disallow: /api/health" in robots
          print("BLACKGOLD_SEARCH_METADATA_PRIVACY=PASS")
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Affiliate redirect fail-open unit gate
        working-directory: blackgold-beauty-finds-novo
        run: node tools/out_failopen_unit.mjs

      - name: Production release must remain blocked before human approval
        working-directory: blackgold-beauty-finds-novo
        run: node tools/release_preflight.mjs --expect-blocked

      - name: Install local Cloudflare runtime
        working-directory: blackgold-beauty-finds-novo
        run: npm install --no-audit --no-fund

      - name: Initialize zero D1
        working-directory: blackgold-beauty-finds-novo
        run: |
          printf 'ADMIN_PANEL_TOKEN=%s\nALLOW_DESTRUCTIVE_RESTORE=true\n' 'CI_BLACKGOLD_ADMIN_7b9f2dcfb90b4ce6a2e7e623d13cc9d1' > .dev.vars
          npx wrangler d1 migrations apply blackgold-beauty-finds-novo --local

      - name: Start Pages runtime
        working-directory: blackgold-beauty-finds-novo
        run: |
          npx wrangler pages dev . --port 8788 --persist-to .wrangler/state >/tmp/bg-wrangler.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8788/api/products >/tmp/bg-products.json; then cat /tmp/bg-products.json; exit 0; fi
            sleep 1
          done
          cat /tmp/bg-wrangler.log
          exit 1

      - name: Runtime health gate
        run: |
          BODY="$(curl --fail --silent http://127.0.0.1:8788/api/health)"
          echo "$BODY"
          echo "$BODY" | grep -q '"ok":true'
          echo "$BODY" | grep -q '"database":true'
          echo "$BODY" | grep -q '"media":true'
          echo "BLACKGOLD_RUNTIME_HEALTH=PASS"

      - name: Create temporary published visual fixture
        working-directory: blackgold-beauty-finds-novo
        env:
          BLACKGOLD_BASE: http://127.0.0.1:8788
          BLACKGOLD_ADMIN_TOKEN: CI_BLACKGOLD_ADMIN_7b9f2dcfb90b4ce6a2e7e623d13cc9d1
        run: node tools/product_visual_fixture.mjs create

      - name: Capture storefront with real published fixture
        run: |
          "${{ steps.chrome.outputs.bin }}" --headless=new --disable-gpu --no-sandbox --hide-scrollbars --virtual-time-budget=1800 --force-device-scale-factor=1 --window-size=1448,1086 --screenshot=blackgold-beauty-finds-novo/.visual-gate/product-desktop.png http://127.0.0.1:8788/
          "${{ steps.chrome.outputs.bin }}" --headless=new --disable-gpu --no-sandbox --hide-scrollbars --virtual-time-budget=1800 --force-device-scale-factor=1 --window-size=310,896 --screenshot=blackgold-beauty-finds-novo/.visual-gate/product-mobile.png http://127.0.0.1:8788/

      - name: Product render may change only approved desktop catalog zones
        run: |
          python blackgold-beauty-finds-novo/tools/outside_catalog_gate.py --profile desktop --authority blackgold-beauty-finds-novo/assets/authority-zero-desktop.png --candidate blackgold-beauty-finds-novo/.visual-gate/product-desktop.png --report blackgold-beauty-finds-novo/.visual-gate/product-desktop.json

      - name: Product render may change only approved mobile catalog zones
        run: |
          python blackgold-beauty-finds-novo/tools/outside_catalog_gate.py --profile mobile --authority blackgold-beauty-finds-novo/assets/authority-zero-mobile.png --candidate blackgold-beauty-finds-novo/.visual-gate/product-mobile.png --report blackgold-beauty-finds-novo/.visual-gate/product-mobile.json

      - name: Remove temporary published visual fixture
        working-directory: blackgold-beauty-finds-novo
        env:
          BLACKGOLD_BASE: http://127.0.0.1:8788
          BLACKGOLD_ADMIN_TOKEN: CI_BLACKGOLD_ADMIN_7b9f2dcfb90b4ce6a2e7e623d13cc9d1
        run: node tools/product_visual_fixture.mjs delete

      - name: Create approved product-layout authority fixture
        working-directory: blackgold-beauty-finds-novo
        env:
          BLACKGOLD_BASE: http://127.0.0.1:8788
          BLACKGOLD_ADMIN_TOKEN: CI_BLACKGOLD_ADMIN_7b9f2dcfb90b4ce6a2e7e623d13cc9d1
        run: node tools/product_authority_fixture.mjs create

      - name: Approved product footprint gate
        working-directory: blackgold-beauty-finds-novo
        env:
          BLACKGOLD_BASE: http://127.0.0.1:8788
          CHROME_BIN: ${{ steps.chrome.outputs.bin }}
        run: node tools/product_geometry_gate.mjs

      - name: Capture approved product-layout candidate
        run: |
          "${{ steps.chrome.outputs.bin }}" --headless=new --disable-gpu --no-sandbox --hide-scrollbars --virtual-time-budget=1800 --force-device-scale-factor=1 --window-size=1448,1086 --screenshot=blackgold-beauty-finds-novo/.visual-gate/authority-products-desktop.png http://127.0.0.1:8788/

      - name: Measure approved product-region fidelity
        run: |
          python blackgold-beauty-finds-novo/tools/product_region_diagnostic.py             --authority cloudflare-beauty-finds/visual-authority/BLACKGOLD_HOME_DESKTOP_MOCKUP_APPROVED_20260909_140134.png             --candidate blackgold-beauty-finds-novo/.visual-gate/authority-products-desktop.png             --report blackgold-beauty-finds-novo/.visual-gate/product-region-diagnostic.json

      - name: Diagnose product-region alignment drift
        run: |
          python blackgold-beauty-finds-novo/tools/product_alignment_search.py \
            --authority cloudflare-beauty-finds/visual-authority/BLACKGOLD_HOME_DESKTOP_MOCKUP_APPROVED_20260909_140134.png \
            --candidate blackgold-beauty-finds-novo/.visual-gate/authority-products-desktop.png \
            --report blackgold-beauty-finds-novo/.visual-gate/product-alignment-search.json

      - name: Remove approved product-layout authority fixture
        working-directory: blackgold-beauty-finds-novo
        env:
          BLACKGOLD_BASE: http://127.0.0.1:8788
          BLACKGOLD_ADMIN_TOKEN: CI_BLACKGOLD_ADMIN_7b9f2dcfb90b4ce6a2e7e623d13cc9d1
        run: node tools/product_authority_fixture.mjs delete

      - name: Admin to storefront integration
        working-directory: blackgold-beauty-finds-novo
        env:
          BLACKGOLD_BASE: http://127.0.0.1:8788
          BLACKGOLD_ADMIN_TOKEN: CI_BLACKGOLD_ADMIN_7b9f2dcfb90b4ce6a2e7e623d13cc9d1
        run: node tools/backend_flow.mjs

      - name: Real admin browser workflow
        working-directory: blackgold-beauty-finds-novo
        env:
          BLACKGOLD_BASE: http://127.0.0.1:8788
          BLACKGOLD_ADMIN_TOKEN: CI_BLACKGOLD_ADMIN_7b9f2dcfb90b4ce6a2e7e623d13cc9d1
          CHROME_BIN: ${{ steps.chrome.outputs.bin }}
        run: node tools/admin_ui_flow.mjs

      - name: Storefront browser workflow
        working-directory: blackgold-beauty-finds-novo
        env:
          BLACKGOLD_BASE: http://127.0.0.1:8788
        run: |
          export BLACKGOLD_ADMIN_TOKEN="$(sed -n 's/^ADMIN_PANEL_TOKEN=//p' .dev.vars)"
          export CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          node tools/storefront_ui_flow.mjs
      - name: Backup and restore roundtrip
        working-directory: blackgold-beauty-finds-novo
        env:
          BLACKGOLD_BASE: http://127.0.0.1:8788
          BLACKGOLD_ADMIN_TOKEN: CI_BLACKGOLD_ADMIN_7b9f2dcfb90b4ce6a2e7e623d13cc9d1
        run: node tools/backup_restore_roundtrip.mjs

      - name: Final catalog zero
        run: |
          curl --fail --silent 'http://127.0.0.1:8788/api/products?final=1' | grep -q '"total":0'
          echo "BLACKGOLD_FINAL_CATALOG_ZERO=PASS"

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blackgold-exact-authority-gate
          path: blackgold-beauty-finds-novo/.visual-gate/
          if-no-files-found: ignore
          retention-days: 7

