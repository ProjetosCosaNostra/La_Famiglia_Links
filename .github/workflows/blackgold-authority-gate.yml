name: BlackGold Authority Gate

on:
  push:
    branches:
      - blackgold-beauty-finds-novo-authority
    paths:
      - "blackgold-beauty-finds-novo/**"
      - ".github/workflows/blackgold-authority-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authority-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout authority branch
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image verifier
        run: python -m pip install --disable-pip-version-check pillow

      - name: Start isolated static server
        run: |
          python -m http.server 8799 --bind 127.0.0.1 --directory blackgold-beauty-finds-novo > /tmp/blackgold-server.log 2>&1 &
          echo $! > /tmp/blackgold-server.pid
          sleep 2
          curl --fail http://127.0.0.1:8799/ > /dev/null

      - name: Locate Chrome
        id: chrome
        run: |
          BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$BIN"
          echo "bin=$BIN" >> "$GITHUB_OUTPUT"

      - name: Capture desktop authority candidate
        run: |
          mkdir -p blackgold-beauty-finds-novo/.visual-gate
          "${{ steps.chrome.outputs.bin }}"             --headless=new --disable-gpu --no-sandbox --hide-scrollbars             --force-device-scale-factor=1 --window-size=1448,1086             --screenshot=blackgold-beauty-finds-novo/.visual-gate/candidate-desktop.png             http://127.0.0.1:8799/

      - name: Capture mobile authority candidate
        run: |
          "${{ steps.chrome.outputs.bin }}"             --headless=new --disable-gpu --no-sandbox --hide-scrollbars             --force-device-scale-factor=1 --window-size=390,1152             --screenshot=blackgold-beauty-finds-novo/.visual-gate/candidate-mobile.png             http://127.0.0.1:8799/

      - name: Zero-tolerance desktop gate
        run: |
          python blackgold-beauty-finds-novo/tools/visual_gate.py             --profile desktop             --authority blackgold-beauty-finds-novo/authority-desktop-v26.webp             --candidate blackgold-beauty-finds-novo/.visual-gate/candidate-desktop.png             --report blackgold-beauty-finds-novo/.visual-gate/desktop.json

      - name: Zero-tolerance mobile gate
        run: |
          python blackgold-beauty-finds-novo/tools/visual_gate.py             --profile mobile             --authority blackgold-beauty-finds-novo/authority-mobile-v24.webp             --candidate blackgold-beauty-finds-novo/.visual-gate/candidate-mobile.png             --report blackgold-beauty-finds-novo/.visual-gate/mobile.json

      - name: Zero-catalog source gate
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path("blackgold-beauty-finds-novo")
          text=(root/"index.html").read_text(encoding="utf-8")+(root/"shell.js").read_text(encoding="utf-8")
          forbidden=["Miss Dior","Dior Saddle","R$ 649,90","193 produtos ativos"]
          found=[x for x in forbidden if x in text]
          if found:
              raise SystemExit("Forbidden legacy catalogue content: "+", ".join(found))
          print("BLACKGOLD_ZERO_CATALOG_SOURCE=PASS")
          PY

      - name: Release guard
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          guard=json.loads(Path("blackgold-beauty-finds-novo/preview-guard.json").read_text(encoding="utf-8"))
          assert guard["productionDeployAllowed"] is False
          assert guard["productionRequiresExplicitHumanApproval"] is True
          assert guard["previewAutoOpenAllowed"] is False
          print("BLACKGOLD_RELEASE_GUARD=PASS")
          PY

      - name: Store gate evidence internally
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blackgold-authority-gate
          path: |
            blackgold-beauty-finds-novo/.visual-gate/*.json
            blackgold-beauty-finds-novo/.visual-gate/*.png
          if-no-files-found: ignore
          retention-days: 7
