name: BlackGold Exact Authority Gate

on:
  push:
    branches:
      - blackgold-beauty-finds-novo-authority
    paths:
      - "blackgold-beauty-finds-novo/**"
      - ".github/workflows/blackgold-authority-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blackgold-authority-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --disable-pip-version-check pillow

      - name: Canonical source lock
        run: |
          python - <<'PY'
          from pathlib import Path
          r=Path("blackgold-beauty-finds-novo")
          obsolete=[
            "authority-desktop-v26.webp",
            "authority-mobile-v24.webp",
            "shell.css",
            "shell.js",
          ]
          found=[name for name in obsolete if (r/name).exists()]
          assert not found, "obsolete visual sources reintroduced: "+", ".join(found)
          verify=(r/"tools/verify.ps1").read_text(encoding="utf-8")
          assert "assets\\authority-desktop-approved.png" in verify
          assert "assets\\authority-mobile-v24.webp" in verify
          assert "outside_catalog_gate.py" in verify
          assert "assets\\authority-zero-desktop.png" not in verify
          assert "assets\\authority-zero-mobile.png" not in verify
          assert "capture_visual.mjs" in verify
          assert "explicitViewportCapture" in verify
          assert (r/"tools/capture_visual.mjs").exists()
          print("BLACKGOLD_CANONICAL_SOURCE_LOCK=PASS")
          PY

      - name: Verify pinned authority assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          r=Path("blackgold-beauty-finds-novo")
          m=json.loads((r/"assets/authority-zero-manifest.json").read_text())
          assert m["contract"]=="BLACKGOLD_APPROVED_AUTHORITY_DYNAMIC_CATALOG_V3"
          assert m["toleranceOutsideDynamicRegionsPixels"]==0
          assert m["desktop"]["viewport"]==[1448,1086]
          assert m["mobile"]["viewport"]==[390,1152]
          assert m["desktop"]["approvedFile"]=="authority-desktop-approved.png"
          assert m["mobile"]["approvedFile"]=="authority-mobile-v24.webp"
          assert m["desktop"]["approvedSha256"]=="5e3e6cef8f0f5e14bde52b5c9f0be9ae9c1d92fd771f3e424b9cf75fbb59f722"
          assert m["mobile"]["approvedSha256"]=="8c817a1bcf7641fddbf1a083ae9c1bf195186e65cf48d5cdb86ed64452de2a26"
          from PIL import Image
          for side in ("desktop","mobile"):
              p=r/"assets"/m[side]["approvedFile"]
              assert p.exists(), f"{side} approved authority missing: {p}"
              assert hashlib.sha256(p.read_bytes()).hexdigest()==m[side]["approvedSha256"], f"{side} approved authority hash mismatch"
              with Image.open(p) as im:
                  assert list(im.size)==m[side]["viewport"], f"{side} approved authority dimension mismatch"
          print("BLACKGOLD_PINNED_AUTHORITY_V3=PASS")
          PY

      - name: Critical asset weight budget
        run: |
          python - <<'PY'
          from pathlib import Path
          assets=Path("blackgold-beauty-finds-novo/assets")
          desktop=assets/"authority-desktop-approved.png"
          mobile=assets/"authority-mobile-v24.webp"
          assert desktop.exists() and mobile.exists()
          d=desktop.stat().st_size
          m=mobile.stat().st_size
          files=[p for p in assets.iterdir() if p.is_file()]
          largest=max((p.stat().st_size,p.name) for p in files)
          assert d<=2_100_000, f"desktop authority asset budget exceeded: {d} bytes"
          assert m<=450_000, f"mobile authority asset budget exceeded: {m} bytes"
          assert largest[0]<=2_100_000, f"oversized asset introduced: {largest[1]} = {largest[0]} bytes"
          print({"desktop":d,"mobile":m,"largest":largest})
          print("BLACKGOLD_CRITICAL_ASSET_BUDGET=PASS")
          PY

      - name: Derive approved product geometry
        run: |
          python blackgold-beauty-finds-novo/tools/authority_product_geometry.py             --approved cloudflare-beauty-finds/visual-authority/BLACKGOLD_HOME_DESKTOP_MOCKUP_APPROVED_20260909_140134.png             --zero blackgold-beauty-finds-novo/assets/authority-zero-desktop.png             --report blackgold-beauty-finds-novo/.visual-gate/authority-product-geometry.json

      - name: Start static authority server
        run: |
          python -m http.server 8799 --bind 127.0.0.1 --directory blackgold-beauty-finds-novo >/tmp/bg-static.log 2>&1 &
          sleep 2
          curl --fail http://127.0.0.1:8799/ >/dev/null

      - name: Locate Chrome
        id: chrome
        run: |
          BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$BIN"
          echo "bin=$BIN" >> "$GITHUB_OUTPUT"

      - name: Stage pinned authority binaries for internal QA
        run: |
          mkdir -p blackgold-beauty-finds-novo/.visual-gate
          cp cloudflare-beauty-finds/visual-authority/BLACKGOLD_HOME_DESKTOP_MOCKUP_APPROVED_20260909_140134.png blackgold-beauty-finds-novo/.visual-gate/approved-full-desktop.png
          cp cloudflare-beauty-finds/authority-mobile-v24.webp blackgold-beauty-finds-novo/.visual-gate/authority-mobile-v24.webp
          cp cloudflare-beauty-finds/mobile-vitrine-authority-v20.webp blackgold-beauty-finds-novo/.visual-gate/mobile-vitrine-authority-v20.webp

      - name: Diagnose zero state against 390px mobile authority
        run: |
          "${{ steps.chrome.outputs.bin }}" --headless=new --disable-gpu --no-sandbox --hide-scrollbars --virtual-time-budget=1800 --force-device-scale-factor=1 --window-size=390,1152 --screenshot=blackgold-beauty-finds-novo/.visual-gate/zero-mobile-390.png http://127.0.0.1:8799/
          python blackgold-beauty-finds-novo/tools/mobile_390_authority_diagnostic.py \
            --authority cloudflare-beauty-finds/authority-mobile-v24.webp \
            --candidate blackgold-beauty-finds-novo/.visual-gate/zero-mobile-390.png \
            --report blackgold-beauty-finds-novo/.visual-gate/zero-mobile-390-diagnostic.json

      - name: Capture legacy approved-product implementation for internal calibration
        run: |
          python -m http.server 8798 --bind 127.0.0.1 --directory . >/tmp/bg-legacy-static.log 2>&1 &
          sleep 2
          "${{ steps.chrome.outputs.bin }}" --headless=new --disable-gpu --no-sandbox --hide-scrollbars --virtual-time-budget=1800 --force-device-scale-factor=1 --window-size=1448,1086 --screenshot=blackgold-beauty-finds-novo/.visual-gate/legacy-approved-products.png http://127.0.0.1:8798/cloudflare-beauty-finds/
          python blackgold-beauty-finds-novo/tools/product_region_diagnostic.py             --authority cloudflare-beauty-finds/visual-authority/BLACKGOLD_HOME_DESKTOP_MOCKUP_APPROVED_20260909_140134.png             --candidate blackgold-beauty-finds-novo/.visual-gate/legacy-approved-products.png             --report blackgold-beauty-finds-novo/.visual-gate/legacy-product-region-diagnostic.json

      - name: Capture approved-authority desktop and mobile
        run: |
          mkdir -p blackgold-beauty-finds-novo/.visual-gate
          "${{ steps.chrome.outputs.bin }}" --headless=new --disable-gpu --no-sandbox --hide-scrollbars --virtual-time-budget=1800 --force-device-scale-factor=1 --window-size=1448,1086 --screenshot=blackgold-beauty-finds-novo/.visual-gate/desktop.png http://127.0.0.1:8799/
          "${{ steps.chrome.outputs.bin }}" --headless=new --disable-gpu --no-sandbox --hide-scrollbars --virtual-time-budget=1800 --force-device-scale-factor=1 --window-size=390,1152 --screenshot=blackgold-beauty-finds-novo/.visual-gate/mobile.png http://127.0.0.1:8799/

      - name: Approved shell gate desktop
        run: |
          python blackgold-beauty-finds-novo/tools/outside_catalog_gate.py --profile desktop --authority blackgold-beauty-finds-novo/assets/authority-desktop-approved.png --candidate blackgold-beauty-finds-novo/.visual-gate/desktop.png --report blackgold-beauty-finds-novo/.visual-gate/desktop.json

      - name: Approved shell gate mobile
        run: |
          python blackgold-beauty-finds-novo/tools/outside_catalog_gate.py --profile mobile --authority blackgold-beauty-finds-novo/assets/authority-mobile-v24.webp --candidate blackgold-beauty-finds-novo/.visual-gate/mobile.png --report blackgold-beauty-finds-novo/.visual-gate/mobile.json

      - name: Wide-screen fill gate
        run: |
          DOM="$("${{ steps.chrome.outputs.bin }}" --headless=new --disable-gpu --no-sandbox --hide-scrollbars --virtual-time-budget=1500 --window-size=1919,960 --dump-dom http://127.0.0.1:8799/ 2>/tmp/bg-wide.log)"
          echo "$DOM" | grep -q 'data-render-width="1919"'
          echo "$DOM" | grep -q 'data-viewport-width="1919"'
          echo "$DOM" | grep -q 'data-horizontal-overflow="false"'
          echo "BLACKGOLD_WIDE_FILL=PASS"

      - name: Zero catalog and release guards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=Path("blackgold-beauty-finds-novo")
          text=(r/"index.html").read_text()+(r/"app.js").read_text()
          forbidden=["Miss Dior","Dior Saddle","R$ 649,90","193 produtos ativos"]
          assert not [x for x in forbidden if x in text]
          g=json.loads((r/"preview-guard.json").read_text())
          assert g["catalogInitialCount"]==0
          assert g["previewAutoOpenAllowed"] is False
          assert g["productionDeployAllowed"] is False
          assert g["desktopAuthority"]=="assets/authority-desktop-approved.png"
          assert g["desktopViewport"]==[1448,1086]
          assert g["mobileAuthority"]=="assets/authority-mobile-v24.webp"
          assert g["mobileViewport"]==[390,1152]
          assert g["outsideDynamicRegionTolerancePixels"]==0
          assert g["previewRequiresApprovedShellGatePass"] is True
          assert g["previewRequiresProductFootprintGatePass"] is True
          assert g["previewRequiresProductStyleGatePass"] is True
          assert g["previewRequiresProductRegionAcceptancePass"] is True
          assert g["productRegionPixelDiagnosticCanApprove"] is False
          assert g["productFootprintContract"]=="BLACKGOLD_APPROVED_PRODUCT_FOOTPRINT_GATE_V1"
          assert g["productStyleContract"]=="BLACKGOLD_APPROVED_PRODUCT_STYLE_GATE_V1"
          assert g["productRegionAcceptanceContract"]=="BLACKGOLD_DYNAMIC_PRODUCT_REGION_ACCEPTANCE_V1"
          print("BLACKGOLD_ZERO_AND_RELEASE_GUARDS=PASS")
          PY

      - name: Search metadata and crawler privacy gate
        run: |
          python - <<'PY'
          from pathlib import Path
          r=Path("blackgold-beauty-finds-novo")
          html=(r/"index.html").read_text(encoding="utf-8")
          robots=(r/"robots.txt").read_text(encoding="utf-8")
          assert 'name="description"' in html
          assert 'property="og:image"' in html
          assert 'name="twitter:card"' in html
          assert 'fetchpriority="high"' in html
          assert "Disallow: /admin.html" in robots
          assert "Disallow: /api/admin/" in robots
          assert "Disallow: /api/health" in robots
          assert "\\n" not in robots and "\\r" not in robots
          assert "Sitemap: https://blackgold-beauty-finds-novo.pages.dev/sitemap.xml" in robots
          print("BLACKGOLD_SEARCH_METADATA_PRIVACY=PASS")
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Affiliate redirect fail-open unit gate
        working-directory: blackgold-beauty-finds-novo
        run: node tools/out_failopen_unit.mjs

      - name: Production release must remain blocked before human approval
        working-directory: blackgold-beauty-finds-novo
        run: node tools/release_preflight.mjs --expect-blocked

      - name: Production deploy script syntax gate
        shell: pwsh
        run: |
          $raw=Get-Content -LiteralPath "blackgold-beauty-finds-novo/tools/deploy-production.ps1" -Raw
          [scriptblock]::Create($raw) | Out-Null
          Write-Host "BLACKGOLD_DEPLOY_POWERSHELL_SYNTAX=PASS"

      - name: Install local Cloudflare runtime
        working-directory: blackgold-beauty-finds-novo
        run: npm install --no-audit --no-fund

      - name: Initialize zero D1
        working-directory: blackgold-beauty-finds-novo
        run: |
          printf 'ADMIN_PANEL_TOKEN=%s\nALLOW_DESTRUCTIVE_RESTORE=true\n' 'CI_BLACKGOLD_ADMIN_7b9f2dcfb90b4ce6a2e7e623d13cc9d1' > .dev.vars
          npx wrangler d1 migrations apply blackgold-beauty-finds-novo --local

      - name: Start Pages runtime
        working-directory: blackgold-beauty-finds-novo
        run: |
          npx wrangler pages dev . --port 8788 --persist-to .wrangler/state >/tmp/bg-wrangler.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8788/api/products >/tmp/bg-products.json; then cat /tmp/bg-products.json; exit 0; fi
            sleep 1
          done
          cat /tmp/bg-wrangler.log
          exit 1

      - name: Runtime health gate
        run: |
          BODY="$(curl --fail --silent http://127.0.0.1:8788/api/health)"
          echo "$BODY"
          echo "$BODY" | grep -q '"ok":true'
          echo "$BODY" | grep -q '"database":true'
          echo "$BODY" | grep -q '"media":true'
          echo "BLACKGOLD_RUNTIME_HEALTH=PASS"

      - name: Create temporary published visual fixture
        working-directory: blackgold-beauty-finds-novo
        env:
          BLACKGOLD_BASE: http://127.0.0.1:8788
          BLACKGOLD_ADMIN_TOKEN: CI_BLACKGOLD_ADMIN_7b9f2dcfb90b4ce6a2e7e623d13cc9d1
        run: node tools/product_visual_fixture.mjs create

      - name: Capture storefront with real published fixture
        run: |
          "${{ steps.chrome.outputs.bin }}" --headless=new --disable-gpu --no-sandbox --hide-scrollbars --virtual-time-budget=1800 --force-device-scale-factor=1 --window-size=1448,1086 --screenshot=blackgold-beauty-finds-novo/.visual-gate/product-desktop.png http://127.0.0.1:8788/
          "${{ steps.chrome.outputs.bin }}" --headless=new --disable-gpu --no-sandbox --hide-scrollbars --virtual-time-budget=1800 --force-device-scale-factor=1 --window-size=390,1152 --screenshot=blackgold-beauty-finds-novo/.visual-gate/product-mobile.png http://127.0.0.1:8788/

      - name: Product render may change only approved desktop catalog zones
        run: |
          python blackgold-beauty-finds-novo/tools/outside_catalog_gate.py --profile desktop --authority blackgold-beauty-finds-novo/assets/authority-desktop-approved.png --candidate blackgold-beauty-finds-novo/.visual-gate/product-desktop.png --report blackgold-beauty-finds-novo/.visual-gate/product-desktop.json

      - name: Product render may change only approved mobile catalog zones
        run: |
          python blackgold-beauty-finds-novo/tools/outside_catalog_gate.py --profile mobile --authority blackgold-beauty-finds-novo/assets/authority-mobile-v24.webp --candidate blackgold-beauty-finds-novo/.visual-gate/product-mobile.png --report blackgold-beauty-finds-novo/.visual-gate/product-mobile.json

      - name: Remove temporary published visual fixture
        working-directory: blackgold-beauty-finds-novo
        env:
          BLACKGOLD_BASE: http://127.0.0.1:8788
          BLACKGOLD_ADMIN_TOKEN: CI_BLACKGOLD_ADMIN_7b9f2dcfb90b4ce6a2e7e623d13cc9d1
        run: node tools/product_visual_fixture.mjs delete

      - name: Create approved product-layout authority fixture
        working-directory: blackgold-beauty-finds-novo
        env:
          BLACKGOLD_BASE: http://127.0.0.1:8788
          BLACKGOLD_ADMIN_TOKEN: CI_BLACKGOLD_ADMIN_7b9f2dcfb90b4ce6a2e7e623d13cc9d1
        run: node tools/product_authority_fixture.mjs create

      - name: Capture 390px product-layout candidate
        run: |
          "${{ steps.chrome.outputs.bin }}" --headless=new --disable-gpu --no-sandbox --hide-scrollbars --virtual-time-budget=1800 --force-device-scale-factor=1 --window-size=390,1152 --screenshot=blackgold-beauty-finds-novo/.visual-gate/authority-products-mobile-390.png http://127.0.0.1:8788/
          python blackgold-beauty-finds-novo/tools/mobile_390_authority_diagnostic.py \
            --authority cloudflare-beauty-finds/authority-mobile-v24.webp \
            --candidate blackgold-beauty-finds-novo/.visual-gate/authority-products-mobile-390.png \
            --report blackgold-beauty-finds-novo/.visual-gate/authority-products-mobile-390-diagnostic.json

      - name: Approved product footprint gate
        working-directory: blackgold-beauty-finds-novo
        env:
          BLACKGOLD_BASE: http://127.0.0.1:8788
          CHROME_BIN: ${{ steps.chrome.outputs.bin }}
        run: node tools/product_geometry_gate.mjs

      - name: Approved dynamic product style gate
        working-directory: blackgold-beauty-finds-novo
        env:
          BLACKGOLD_BASE: http://127.0.0.1:8788
          CHROME_BIN: ${{ steps.chrome.outputs.bin }}
        run: node tools/product_style_gate.mjs

      - name: Internal product visual parameter tuning
        working-directory: blackgold-beauty-finds-novo
        env:
          BLACKGOLD_BASE: http://127.0.0.1:8788
          CHROME_BIN: ${{ steps.chrome.outputs.bin }}
        run: |
          node tools/product_tuning_capture.mjs
          python tools/product_tuning_eval.py \
            --authority ../cloudflare-beauty-finds/visual-authority/BLACKGOLD_HOME_DESKTOP_MOCKUP_APPROVED_20260909_140134.png \
            --dir .visual-gate/tuning \
            --report .visual-gate/product-tuning.json

      - name: Capture approved product-layout candidate
        run: |
          "${{ steps.chrome.outputs.bin }}" --headless=new --disable-gpu --no-sandbox --hide-scrollbars --virtual-time-budget=1800 --force-device-scale-factor=1 --window-size=1448,1086 --screenshot=blackgold-beauty-finds-novo/.visual-gate/authority-products-desktop.png http://127.0.0.1:8788/

      - name: Measure approved product-region fidelity
        run: |
          python blackgold-beauty-finds-novo/tools/product_region_diagnostic.py             --authority cloudflare-beauty-finds/visual-authority/BLACKGOLD_HOME_DESKTOP_MOCKUP_APPROVED_20260909_140134.png             --candidate blackgold-beauty-finds-novo/.visual-gate/authority-products-desktop.png             --report blackgold-beauty-finds-novo/.visual-gate/product-region-diagnostic.json

      - name: Dynamic product-region acceptance gate
        run: |
          python blackgold-beauty-finds-novo/tools/product_region_acceptance.py \
            --authority cloudflare-beauty-finds/visual-authority/BLACKGOLD_HOME_DESKTOP_MOCKUP_APPROVED_20260909_140134.png \
            --candidate blackgold-beauty-finds-novo/.visual-gate/authority-products-desktop.png \
            --legacy blackgold-beauty-finds-novo/.visual-gate/legacy-approved-products.png \
            --report blackgold-beauty-finds-novo/.visual-gate/product-region-acceptance.json

      - name: Diagnose product-region alignment drift
        run: |
          python blackgold-beauty-finds-novo/tools/product_alignment_search.py \
            --authority cloudflare-beauty-finds/visual-authority/BLACKGOLD_HOME_DESKTOP_MOCKUP_APPROVED_20260909_140134.png \
            --candidate blackgold-beauty-finds-novo/.visual-gate/authority-products-desktop.png \
            --report blackgold-beauty-finds-novo/.visual-gate/product-alignment-search.json

      - name: Inspect approved product-card border signature
        run: |
          python blackgold-beauty-finds-novo/tools/product_border_signature.py \
            --authority cloudflare-beauty-finds/visual-authority/BLACKGOLD_HOME_DESKTOP_MOCKUP_APPROVED_20260909_140134.png \
            --candidate blackgold-beauty-finds-novo/.visual-gate/authority-products-desktop.png \
            --report blackgold-beauty-finds-novo/.visual-gate/product-border-signature.json

      - name: Inspect approved product-card edge signature
        run: |
          python blackgold-beauty-finds-novo/tools/product_edge_signature.py \
            --authority cloudflare-beauty-finds/visual-authority/BLACKGOLD_HOME_DESKTOP_MOCKUP_APPROVED_20260909_140134.png \
            --candidate blackgold-beauty-finds-novo/.visual-gate/authority-products-desktop.png \
            --report blackgold-beauty-finds-novo/.visual-gate/product-edge-signature.json

      - name: Remove approved product-layout authority fixture
        working-directory: blackgold-beauty-finds-novo
        env:
          BLACKGOLD_BASE: http://127.0.0.1:8788
          BLACKGOLD_ADMIN_TOKEN: CI_BLACKGOLD_ADMIN_7b9f2dcfb90b4ce6a2e7e623d13cc9d1
        run: node tools/product_authority_fixture.mjs delete

      - name: Admin to storefront integration
        working-directory: blackgold-beauty-finds-novo
        env:
          BLACKGOLD_BASE: http://127.0.0.1:8788
          BLACKGOLD_ADMIN_TOKEN: CI_BLACKGOLD_ADMIN_7b9f2dcfb90b4ce6a2e7e623d13cc9d1
        run: node tools/backend_flow.mjs

      - name: Real admin browser workflow
        working-directory: blackgold-beauty-finds-novo
        env:
          BLACKGOLD_BASE: http://127.0.0.1:8788
          BLACKGOLD_ADMIN_TOKEN: CI_BLACKGOLD_ADMIN_7b9f2dcfb90b4ce6a2e7e623d13cc9d1
          CHROME_BIN: ${{ steps.chrome.outputs.bin }}
        run: node tools/admin_ui_flow.mjs

      - name: Storefront browser workflow
        working-directory: blackgold-beauty-finds-novo
        env:
          BLACKGOLD_BASE: http://127.0.0.1:8788
        run: |
          export BLACKGOLD_ADMIN_TOKEN="$(sed -n 's/^ADMIN_PANEL_TOKEN=//p' .dev.vars)"
          export CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          node tools/storefront_ui_flow.mjs
      - name: Backup and restore roundtrip
        working-directory: blackgold-beauty-finds-novo
        env:
          BLACKGOLD_BASE: http://127.0.0.1:8788
          BLACKGOLD_ADMIN_TOKEN: CI_BLACKGOLD_ADMIN_7b9f2dcfb90b4ce6a2e7e623d13cc9d1
        run: node tools/backup_restore_roundtrip.mjs

      - name: Final catalog zero
        run: |
          curl --fail --silent 'http://127.0.0.1:8788/api/products?final=1' | grep -q '"total":0'
          echo "BLACKGOLD_FINAL_CATALOG_ZERO=PASS"

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blackgold-exact-authority-gate
          path: blackgold-beauty-finds-novo/.visual-gate/
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: true

