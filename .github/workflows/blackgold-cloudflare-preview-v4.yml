name: BlackGold Beauty Finds - Visual V7 Preview

on:
  workflow_dispatch:
  push:
    branches:
      - blackgold-contract-v4-staging
    paths:
      - 'cloudflare-beauty-finds/**'
      - 'produtos.json'
      - 'data/daily_selection.json'
      - 'ecosystem.json'
      - '.github/workflows/blackgold-cloudflare-preview-v4.yml'

permissions:
  contents: read

env:
  PROJECT_NAME: blackgold-beauty-finds-br
  PREVIEW_BRANCH: blackgold-contract-v4-staging
  WRANGLER_VERSION: 4.129.0

jobs:
  deploy-preview-v7:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout V7 staging
        uses: actions/checkout@v4
        with:
          ref: blackgold-contract-v4-staging
          fetch-depth: 1

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verificar credenciais Cloudflare
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [ -n "$CF_TOKEN" ] || { echo 'CLOUDFLARE_API_TOKEN ausente'; exit 2; }
          [ -n "$CF_ACCOUNT" ] || { echo 'CLOUDFLARE_ACCOUNT_ID ausente'; exit 3; }

      - name: Construir pacote V7
        working-directory: cloudflare-beauty-finds
        run: |
          set -euo pipefail
          node build.mjs
          for f in index.html destaque.html vitrine.html ecossistema.html blackgold-v7.css blackgold-v7.js ecosystem.json; do
            test -f "dist/$f" || { echo "Falta dist/$f"; exit 10; }
          done
          for page in index.html destaque.html vitrine.html ecossistema.html; do
            grep -q 'blackgold-v7.css' "dist/$page" || { echo "$page sem CSS V7"; exit 11; }
            grep -q 'blackgold-v7.js' "dist/$page" || { echo "$page sem JS V7"; exit 12; }
            if grep -Eq 'blackgold-v[23456]\.css|blackgold-v[23456]\.js' "dist/$page"; then
              echo "ERRO: $page ainda referencia contrato visual legado."
              exit 13
            fi
          done
          node -e "const m=require('./dist/ecosystem.json'); if(m.version!=='2.1') process.exit(14); if(!m.projects?.some(x=>x.id==='appevidex')) process.exit(15); if(!m.channels?.some(x=>x.id==='tiktok' && String(x.canonical_url).includes('@cosanostraresolve'))) process.exit(16); if(m.hub?.canonical_url!=='https://blackgold-beauty-finds-br.pages.dev/') process.exit(17);"

      - name: Publicar somente em PREVIEW
        working-directory: cloudflare-beauty-finds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} pages deploy dist \
            --project-name="$PROJECT_NAME" \
            --branch="$PREVIEW_BRANCH" \
            --commit-hash="$GITHUB_SHA" \
            --commit-dirty=true

      - name: Validar preview V7
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          sleep 8
          api="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/pages/projects/${PROJECT_NAME}/deployments"
          curl -sS -H "Authorization: Bearer ${CF_TOKEN}" "$api" > /tmp/deployments.json

          PREVIEW_URL=$(node <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync('/tmp/deployments.json','utf8'));
          if (!body.success || !Array.isArray(body.result)) process.exit(20);
          const branch = process.env.PREVIEW_BRANCH;
          const hit = body.result.find(d => d?.deployment_trigger?.metadata?.branch === branch);
          if (!hit?.url) process.exit(21);
          process.stdout.write(hit.url);
          NODE
          )
          echo "PREVIEW_URL=$PREVIEW_URL" >> "$GITHUB_ENV"
          echo "Preview V7: $PREVIEW_URL"

          for route in / /destaque.html /vitrine.html /ecossistema.html /ecosystem.json /admin.html; do
            code=000
            for attempt in 1 2 3 4 5; do
              code=$(curl -sS -L -o /tmp/route.out -w '%{http_code}' --max-time 45 "$PREVIEW_URL$route") || true
              [ "$code" = '200' ] && break
              sleep 4
            done
            [ "$code" = '200' ] || { echo "$route falhou: HTTP $code"; exit 22; }
          done
          curl -sS -L "$PREVIEW_URL/" > /tmp/home.html
          grep -q 'blackgold-v7.css' /tmp/home.html || { echo 'Preview não está servindo V7'; exit 23; }
          grep -q 'blackgold-v7.js' /tmp/home.html || { echo 'Preview não está servindo JS V7'; exit 24; }

          {
            echo '## BlackGold Beauty Finds — Preview V7'
            echo ''
            echo "- Branch: $PREVIEW_BRANCH"
            echo "- Commit: $GITHUB_SHA"
            echo "- URL: $PREVIEW_URL"
            echo '- Home + Destaque + Vitrine + Ecossistema + Admin: HTTP 200'
            echo '- Manifesto V2.1: confirmado'
            echo '- Produção: não alterada'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Capturar provas visuais V7
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visual-proof
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          [ -n "$CHROME" ] || { echo 'Chrome/Chromium não encontrado no runner'; exit 30; }
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1448,1086 \
            --screenshot="$PWD/visual-proof/home-desktop-1448x1086.png" "$PREVIEW_URL/"
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,1240 \
            --screenshot="$PWD/visual-proof/home-mobile-390x1240.png" "$PREVIEW_URL/"
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1448,1086 \
            --screenshot="$PWD/visual-proof/destaque-desktop.png" "$PREVIEW_URL/destaque.html"
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1448,1086 \
            --screenshot="$PWD/visual-proof/vitrine-desktop.png" "$PREVIEW_URL/vitrine.html"
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1448,1086 \
            --screenshot="$PWD/visual-proof/ecossistema-desktop.png" "$PREVIEW_URL/ecossistema.html"
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,1240 \
            --screenshot="$PWD/visual-proof/ecossistema-mobile.png" "$PREVIEW_URL/ecossistema.html"
          test -s visual-proof/home-desktop-1448x1086.png
          test -s visual-proof/home-mobile-390x1240.png
          test -s visual-proof/destaque-desktop.png
          test -s visual-proof/vitrine-desktop.png
          test -s visual-proof/ecossistema-desktop.png

      - name: Guardar provas visuais V7
        uses: actions/upload-artifact@v4
        with:
          name: blackgold-v7-visual-proof
          path: visual-proof/*.png
          if-no-files-found: error
          retention-days: 7
