name: BlackGold Beauty Finds - Visual Contract Preview

on:
  workflow_dispatch:
  push:
    branches:
      - blackgold-contract-v4-staging
    paths:
      - 'cloudflare-beauty-finds/**'
      - 'produtos.json'
      - 'data/daily_selection.json'
      - 'ecosystem.json'
      - '.github/workflows/blackgold-cloudflare-preview-v4.yml'

permissions:
  contents: read

env:
  PROJECT_NAME: blackgold-beauty-finds-br
  PREVIEW_BRANCH: blackgold-contract-v4-staging
  WRANGLER_VERSION: 4.129.0

jobs:
  deploy-preview-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout visual staging
        uses: actions/checkout@v4
        with:
          ref: blackgold-contract-v4-staging
          fetch-depth: 1

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Guardar produção congelada
        shell: bash
        run: |
          set -euo pipefail
          [ "$GITHUB_REF_NAME" = "$PREVIEW_BRANCH" ] || { echo "Bloqueado: workflow visual só pode rodar em $PREVIEW_BRANCH"; exit 1; }
          [ "$PREVIEW_BRANCH" != "blackgold-beauty-cloudflare" ] || { echo 'Bloqueado: branch de produção não pode ser usada como preview'; exit 1; }

      - name: Verificar credenciais Cloudflare
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [ -n "$CF_TOKEN" ] || { echo 'CLOUDFLARE_API_TOKEN ausente'; exit 2; }
          [ -n "$CF_ACCOUNT" ] || { echo 'CLOUDFLARE_ACCOUNT_ID ausente'; exit 3; }

      - name: Construir pacote visual
        working-directory: cloudflare-beauty-finds
        run: |
          set -euo pipefail
          node build.mjs
          for f in index.html destaque.html vitrine.html ecossistema.html blackgold-v9.css blackgold-v9.js blackgold-v10-overrides.css blackgold-v12-final.css blackgold-v13-exact.css blackgold-v14-calibration.css blackgold-v15-contract-final.css exact-brand-v13.webp exact-ecosystem-center-v13.webp ecosystem.json admin.html; do
            test -f "dist/$f" || { echo "Falta dist/$f"; exit 10; }
          done
          for page in index.html destaque.html vitrine.html ecossistema.html; do
            grep -q 'blackgold-v9.css' "dist/$page" || { echo "$page sem CSS base"; exit 11; }
            grep -q 'blackgold-v10-overrides.css?v=20260907-v11' "dist/$page" || { echo "$page sem V11"; exit 12; }
            grep -q 'blackgold-v12-final.css?v=20260907-v12' "dist/$page" || { echo "$page sem V12"; exit 13; }
            grep -q 'blackgold-v13-exact.css?v=20260907-v13' "dist/$page" || { echo "$page sem V13"; exit 14; }
            grep -q 'blackgold-v14-calibration.css?v=20260907-v14' "dist/$page" || { echo "$page sem V14"; exit 15; }
            grep -q 'blackgold-v15-contract-final.css?v=20260908-v15' "dist/$page" || { echo "$page sem V15"; exit 16; }
            grep -q 'blackgold-v9.js' "dist/$page" || { echo "$page sem JS compartilhado"; exit 17; }
          done
          node -e "const m=require('./dist/ecosystem.json'); if(m.version!=='2.1') process.exit(18); if(!m.projects?.some(x=>x.id==='appevidex')) process.exit(19); if(!m.channels?.some(x=>x.id==='tiktok')) process.exit(20);"

      - name: Publicar somente em PREVIEW
        working-directory: cloudflare-beauty-finds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [ "$PREVIEW_BRANCH" = "blackgold-contract-v4-staging" ] || { echo 'Preview branch inesperada'; exit 21; }
          npx --yes wrangler@${WRANGLER_VERSION} pages deploy dist \
            --project-name="$PROJECT_NAME" \
            --branch="$PREVIEW_BRANCH" \
            --commit-hash="$GITHUB_SHA" \
            --commit-dirty=true

      - name: Validar preview
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          sleep 8
          api="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/pages/projects/${PROJECT_NAME}/deployments"
          curl -sS -H "Authorization: Bearer ${CF_TOKEN}" "$api" > /tmp/deployments.json
          PREVIEW_URL=$(node <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync('/tmp/deployments.json','utf8'));
          if (!body.success || !Array.isArray(body.result)) process.exit(22);
          const hit = body.result.find(d => d?.deployment_trigger?.metadata?.branch === process.env.PREVIEW_BRANCH);
          if (!hit?.url) process.exit(23);
          process.stdout.write(hit.url);
          NODE
          )
          echo "PREVIEW_URL=$PREVIEW_URL" >> "$GITHUB_ENV"
          echo "Preview: $PREVIEW_URL"
          for route in / /destaque.html /vitrine.html /ecossistema.html /ecosystem.json /admin.html; do
            code=000
            for attempt in 1 2 3 4 5; do
              code=$(curl -sS -L -o /tmp/route.out -w '%{http_code}' --max-time 45 "$PREVIEW_URL$route") || true
              [ "$code" = '200' ] && break
              sleep 4
            done
            [ "$code" = '200' ] || { echo "$route falhou: HTTP $code"; exit 24; }
          done
          curl -sS -L "$PREVIEW_URL/" > /tmp/home.html
          grep -q 'blackgold-v14-calibration.css?v=20260907-v14' /tmp/home.html || { echo 'Home publicada sem V14'; exit 25; }
          grep -q 'blackgold-v15-contract-final.css?v=20260908-v15' /tmp/home.html || { echo 'Home publicada sem V15'; exit 26; }
          grep -q 'blackgold-v9.js' /tmp/home.html || { echo 'Home publicada sem JS compartilhado'; exit 27; }
          {
            echo '## BlackGold Beauty Finds — Visual Contract Preview'
            echo ''
            echo "- Branch: $PREVIEW_BRANCH"
            echo "- Commit: $GITHUB_SHA"
            echo "- URL: $PREVIEW_URL"
            echo '- V15: carregado e validado no HTML publicado'
            echo '- Home + Destaque + Vitrine + Ecossistema + Admin: HTTP 200'
            echo '- Manifesto V2.1: confirmado'
            echo '- Produção: congelada e não alterada'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Capturar provas desktop e mobile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visual-proof
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          [ -n "$CHROME" ] || { echo 'Chrome/Chromium não encontrado'; exit 30; }
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1448,1086 --screenshot="$PWD/visual-proof/home-desktop-1448x1086.png" "$PREVIEW_URL/"
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,1240 --screenshot="$PWD/visual-proof/home-mobile-390x1240.png" "$PREVIEW_URL/"
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1448,1086 --screenshot="$PWD/visual-proof/destaque-desktop.png" "$PREVIEW_URL/destaque.html"
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,1240 --screenshot="$PWD/visual-proof/destaque-mobile.png" "$PREVIEW_URL/destaque.html"
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1448,1086 --screenshot="$PWD/visual-proof/vitrine-desktop.png" "$PREVIEW_URL/vitrine.html"
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,1240 --screenshot="$PWD/visual-proof/vitrine-mobile.png" "$PREVIEW_URL/vitrine.html"
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1448,1086 --screenshot="$PWD/visual-proof/ecossistema-desktop.png" "$PREVIEW_URL/ecossistema.html"
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,1240 --screenshot="$PWD/visual-proof/ecossistema-mobile.png" "$PREVIEW_URL/ecossistema.html"
          for f in visual-proof/*.png; do test -s "$f" || exit 31; done

      - name: Guardar provas visuais
        uses: actions/upload-artifact@v4
        with:
          name: blackgold-visual-contract-proof
          path: visual-proof/*.png
          if-no-files-found: error
          retention-days: 7