name: BlackGold Beauty Finds - V24 Zero Pixel Preview

on:
  workflow_dispatch:
  push:
    branches:
      - blackgold-contract-v4-staging
    paths:
      - 'cloudflare-beauty-finds/**'
      - 'ecosystem.json'
      - '.github/workflows/blackgold-cloudflare-preview-v4.yml'

permissions:
  contents: read

env:
  PROJECT_NAME: blackgold-beauty-finds-br
  PREVIEW_BRANCH: blackgold-contract-v4-staging
  PRODUCTION_BRANCH: blackgold-beauty-cloudflare
  PRODUCTION_LOCK_SHA: 048638bf9e1496de55d0aab78aee0aa0c2f24466
  WRANGLER_VERSION: 4.129.0

jobs:
  deploy-preview-zero-pixel:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout visual staging
        uses: actions/checkout@v4
        with:
          ref: blackgold-contract-v4-staging
          fetch-depth: 0

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Guardar produção congelada
        shell: bash
        run: |
          set -euo pipefail
          [ "$GITHUB_REF_NAME" = "$PREVIEW_BRANCH" ] || { echo "Bloqueado: workflow só pode rodar em $PREVIEW_BRANCH"; exit 1; }
          [ "$PREVIEW_BRANCH" != "$PRODUCTION_BRANCH" ] || { echo 'Bloqueado: produção não pode ser usada como preview'; exit 2; }
          PROD_SHA=$(git ls-remote origin "refs/heads/${PRODUCTION_BRANCH}" | awk '{print $1}')
          [ "$PROD_SHA" = "$PRODUCTION_LOCK_SHA" ] || { echo "Produção saiu do lock esperado: $PROD_SHA"; exit 3; }
          echo "Produção confirmada e congelada em $PROD_SHA"

      - name: Verificar freeze ativo da automação de catálogo
        working-directory: cloudflare-beauty-finds
        shell: bash
        env:
          PROD_SYNC_ENABLED: ${{ vars.BLACKGOLD_PRODUCTION_SYNC_ENABLED }}
        run: |
          set -euo pipefail
          mkdir -p visual-proof
          git fetch origin gh-pages:refs/remotes/origin/gh-pages
          git show origin/gh-pages:.github/workflows/sync-cloudflare-catalog.yml > /tmp/blackgold-sync-cloudflare-catalog.yml
          PROD_SHA=$(git ls-remote origin "refs/heads/${PRODUCTION_BRANCH}" | awk '{print $1}')
          python tools/v24_production_freeze_gate.py \
            --production-current "$PROD_SHA" \
            --production-lock "$PRODUCTION_LOCK_SHA" \
            --sync-enabled "${PROD_SYNC_ENABLED:-}" \
            --sync-workflow /tmp/blackgold-sync-cloudflare-catalog.yml \
            --output visual-proof/production-freeze-report.json

      - name: Verificar credenciais Cloudflare
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [ -n "$CF_TOKEN" ] || { echo 'CLOUDFLARE_API_TOKEN ausente'; exit 4; }
          [ -n "$CF_ACCOUNT" ] || { echo 'CLOUDFLARE_ACCOUNT_ID ausente'; exit 5; }

      - name: Instalar runtime do gate visual
        run: python -m pip install --disable-pip-version-check pillow

      - name: Construir V24 authority-first
        working-directory: cloudflare-beauty-finds
        shell: bash
        run: |
          set -euo pipefail
          node build.mjs
          mkdir -p visual-proof
          python tools/v24_semantic_gate.py --html dist/index.html --report visual-proof/semantic-hotspot-report.json
          for f in index.html authority-desktop-v26.webp authority-mobile-v24.webp destaque.html vitrine.html ecossistema.html ecosystem.json admin.html; do
            test -s "dist/$f" || { echo "Falta dist/$f"; exit 10; }
          done
          grep -q 'authority-desktop-v26.webp' dist/index.html || { echo 'Home sem autoridade desktop V24'; exit 11; }
          grep -q 'authority-mobile-v24.webp' dist/index.html || { echo 'Home sem autoridade mobile V24'; exit 12; }
          grep -q 'https://blackgold-beauty-finds-br.pages.dev/' dist/index.html || { echo 'Hub/Loja canônico ausente'; exit 13; }
          grep -q 'https://www.youtube.com/@cosanostra.blackgold' dist/index.html || { echo 'YouTube oficial ausente'; exit 14; }
          ! grep -q 'projetoscosanostra.github.io/La_Famiglia_Links/' dist/index.html || { echo 'URL legada do Hub reapareceu'; exit 15; }
          node -e "const m=require('./dist/ecosystem.json'); if(m.version!=='2.1') process.exit(16); if(!m.projects?.some(x=>x.id==='appevidex')) process.exit(17); if(!m.channels?.some(x=>x.id==='tiktok')) process.exit(18);"

      - name: Publicar somente em PREVIEW
        working-directory: cloudflare-beauty-finds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          [ "$PREVIEW_BRANCH" = "blackgold-contract-v4-staging" ] || { echo 'Preview branch inesperada'; exit 20; }
          npx --yes wrangler@${WRANGLER_VERSION} pages deploy dist \
            --project-name="$PROJECT_NAME" \
            --branch="$PREVIEW_BRANCH" \
            --commit-hash="$GITHUB_SHA" \
            --commit-dirty=true

      - name: Resolver e validar preview
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          sleep 8
          api="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/pages/projects/${PROJECT_NAME}/deployments"
          curl -sS -H "Authorization: Bearer ${CF_TOKEN}" "$api" > /tmp/deployments.json
          PREVIEW_URL=$(node <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync('/tmp/deployments.json','utf8'));
          if (!body.success || !Array.isArray(body.result)) process.exit(21);
          const hit = body.result.find(d => d?.deployment_trigger?.metadata?.branch === process.env.PREVIEW_BRANCH);
          if (!hit?.url) process.exit(22);
          process.stdout.write(hit.url);
          NODE
          )
          echo "PREVIEW_URL=$PREVIEW_URL" >> "$GITHUB_ENV"
          echo "Preview técnico: $PREVIEW_URL"
          for route in / /authority-desktop-v26.webp /authority-mobile-v24.webp /destaque.html /vitrine.html /ecossistema.html /ecosystem.json /admin.html; do
            code=000
            for attempt in 1 2 3 4 5; do
              code=$(curl -sS -L -o /tmp/route.out -w '%{http_code}' --max-time 45 "$PREVIEW_URL$route") || true
              [ "$code" = '200' ] && break
              sleep 4
            done
            [ "$code" = '200' ] || { echo "$route falhou: HTTP $code"; exit 23; }
          done
          curl -sS -L "$PREVIEW_URL/" > /tmp/home.html
          grep -q 'authority-desktop-v26.webp' /tmp/home.html || { echo 'Preview sem desktop V24'; exit 24; }
          grep -q 'authority-mobile-v24.webp' /tmp/home.html || { echo 'Preview sem mobile V24'; exit 25; }
          grep -q 'https://blackgold-beauty-finds-br.pages.dev/' /tmp/home.html || { echo 'Preview sem Hub canônico'; exit 26; }
          grep -q 'https://www.youtube.com/@cosanostra.blackgold' /tmp/home.html || { echo 'Preview sem YouTube oficial'; exit 27; }

      - name: Iniciar Chrome controlado por DevTools
        shell: bash
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          [ -n "$CHROME" ] || { echo 'Chrome/Chromium não encontrado'; exit 30; }
          READY=0
          for launch in 1 2 3; do
            echo "CDP launch attempt $launch/3"
            rm -rf /tmp/blackgold-cdp
            "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars \
              --no-first-run --no-default-browser-check --remote-debugging-address=127.0.0.1 \
              '--remote-allow-origins=*' --remote-debugging-port=9333 \
              --user-data-dir=/tmp/blackgold-cdp about:blank >"/tmp/blackgold-chrome-${launch}.log" 2>&1 &
            PID=$!
            echo "$PID" > /tmp/blackgold-chrome.pid
            for i in $(seq 1 100); do
              if curl -fsS http://127.0.0.1:9333/json/version >/dev/null 2>&1; then READY=1; break; fi
              if ! kill -0 "$PID" 2>/dev/null; then break; fi
              sleep 0.25
            done
            [ "$READY" = '1' ] && break
            kill "$PID" 2>/dev/null || true
            sleep 1
          done
          if [ "$READY" != '1' ]; then
            echo 'Chrome CDP falhou após 3 tentativas.'
            cat /tmp/blackgold-chrome-*.log || true
            exit 31
          fi
          echo 'CDP_ENDPOINT=http://127.0.0.1:9333' >> "$GITHUB_ENV"
      - name: Capturar 9 provas com viewport real
        working-directory: cloudflare-beauty-finds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visual-proof
          node tools/capture_cdp.mjs --url "$PREVIEW_URL/" --width 1448 --height 1086 --output visual-proof/home-desktop-1448x1086.png
          node tools/capture_cdp.mjs --url "$PREVIEW_URL/" --width 1914 --height 955 --output visual-proof/home-desktop-ambient-fit-1914x955.png
          node tools/capture_cdp.mjs --url "$PREVIEW_URL/" --width 390 --height 1152 --output visual-proof/home-mobile-390x1152.png
          node tools/capture_cdp.mjs --url "$PREVIEW_URL/destaque.html" --width 1448 --height 1086 --output visual-proof/destaque-desktop.png
          node tools/capture_cdp.mjs --url "$PREVIEW_URL/destaque.html" --width 390 --height 1152 --output visual-proof/destaque-mobile.png
          node tools/capture_cdp.mjs --url "$PREVIEW_URL/vitrine.html" --width 1448 --height 1086 --output visual-proof/vitrine-desktop.png
          node tools/capture_cdp.mjs --url "$PREVIEW_URL/vitrine.html" --width 390 --height 1152 --output visual-proof/vitrine-mobile.png
          node tools/capture_cdp.mjs --url "$PREVIEW_URL/ecossistema.html" --width 1448 --height 1086 --output visual-proof/ecossistema-desktop.png
          node tools/capture_cdp.mjs --url "$PREVIEW_URL/ecossistema.html" --width 390 --height 1152 --output visual-proof/ecossistema-mobile.png
          for f in visual-proof/*.png; do test -s "$f" || exit 32; done

      - name: Matriz de interação runtime V24
        working-directory: cloudflare-beauty-finds
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PREVIEW_URL" || { echo 'PREVIEW_URL ausente antes da matriz runtime'; exit 34; }
          node tools/v24_interaction_matrix.mjs --report visual-proof/runtime-interaction-matrix.json
          node -e "const r=require('./visual-proof/runtime-interaction-matrix.json'); if(r.summary?.result!=='GREEN'||r.summary?.fail!==0||r.summary?.runtime_errors!==0) process.exit(34); console.log('INTERACTION MATRIX GREEN',r.summary.pass+'/'+r.summary.total);"
      - name: Gate obrigatório ZERO PIXELS
        working-directory: cloudflare-beauty-finds
        shell: bash
        run: |
          set -euo pipefail
          python tools/visual_zero_gate.py \
            --manifest visual-authority/VISUAL_AUTHORITY_MANIFEST.json \
            --desktop-capture visual-proof/home-desktop-1448x1086.png \
            --mobile-capture visual-proof/home-mobile-390x1152.png \
            --report visual-proof/zero-pixel-report.json \
            --diff-dir visual-proof/diff
          node -e "const r=require('./visual-proof/zero-pixel-report.json'); if(!r.pass) process.exit(33); const d=r.results.find(x=>x.name==='desktop'); const m=r.results.find(x=>x.name==='mobile'); console.log('ZERO-PIXEL PASS', d.mismatch_pixels, m.mismatch_pixels);"
          {
            echo '## BlackGold Beauty Finds — V24 ZERO PIXEL'
            echo ''
            echo "- Branch: $PREVIEW_BRANCH"
            echo "- Commit: $GITHUB_SHA"
            echo "- Preview técnico: $PREVIEW_URL"
            echo '- Desktop 1448×1086: 0 pixels divergentes'
            echo '- Mobile 390×1152: 0 pixels divergentes'
            echo '- Autoridades: hashes oficiais e RGB travados no manifesto'
            echo '- Semantic/hotspot gate: PASS; 34 hotspots, foco por teclado e alvos mobile >=44px'
            echo '- Runtime interaction matrix: GREEN; 14/14 testes, incluindo viewport-fit 1914x955 com mockup inteiro visível e laterais ambient BlackGold'
            echo '- Desktop 1914x955: mockup inteiro visível, proporcional, centralizado, sem scroll e sem laterais pretas'
            echo '- Production automation freeze: ACTIVE; catalog sync to production is blocked'
            echo '- Produção: congelada e não alterada'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Gate consolidado da Missão 1
        working-directory: cloudflare-beauty-finds
        shell: bash
        run: |
          set -euo pipefail
          python tools/v24_mission1_gate.py \
            --zero visual-proof/zero-pixel-report.json \
            --semantic visual-proof/semantic-hotspot-report.json \
            --runtime visual-proof/runtime-interaction-matrix.json \
            --freeze visual-proof/production-freeze-report.json \
            --output visual-proof/mission1-preapproval-gate.json \
            --staging-commit "$GITHUB_SHA" \
            --production-lock "$PRODUCTION_LOCK_SHA"
          node -e "const r=require('./visual-proof/mission1-preapproval-gate.json'); if(!r.pass||r.production_promotion_allowed!==false||r.production_freeze?.production_sync_enabled!==false||r.status!=='PASS_AWAITING_EXPLICIT_USER_APPROVAL') process.exit(35); console.log(r.status);"
          {
            echo ''
            echo '### Mission 1 consolidated gate'
            echo '- Technical status: PASS'
            echo '- Production promotion: BLOCKED'
            echo '- Explicit user visual approval: REQUIRED'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Guardar provas e relatório do gate
        uses: actions/upload-artifact@v4
        with:
          name: blackgold-v24-zero-pixel-proof
          path: |
            cloudflare-beauty-finds/visual-proof/*.png
            cloudflare-beauty-finds/visual-proof/*.json
            cloudflare-beauty-finds/visual-authority/VISUAL_AUTHORITY_MANIFEST.json
          if-no-files-found: error
          retention-days: 14

      - name: Encerrar Chrome de teste
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/blackgold-chrome.pid ]; then
            kill "$(cat /tmp/blackgold-chrome.pid)" 2>/dev/null || true
          fi
