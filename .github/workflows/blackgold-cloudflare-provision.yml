name: BlackGold Beauty Finds - Provision Cloudflare Infrastructure

on:
  workflow_dispatch:
    inputs:
      execute:
        description: 'Create missing D1/R2 resources and configure bindings'
        required: true
        type: boolean
        default: false
      confirm:
        description: 'For execute=true, type exactly PROVISION_BLACKGOLD_BEAUTY_INFRA'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: blackgold-cloudflare-provision
  cancel-in-progress: false

env:
  PROJECT_NAME: blackgold-beauty-finds-br
  D1_NAME: blackgold-beauty-finds-novo
  WRANGLER_VERSION: 4.129.0

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout authority branch
        uses: actions/checkout@v4
        with:
          ref: blackgold-beauty-finds-novo-authority
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate execution request before any write
        if: ${{ inputs.execute }}
        shell: bash
        env:
          CONFIRM: ${{ inputs.confirm }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_TOKEN: ${{ secrets.BLACKGOLD_ADMIN_PANEL_TOKEN }}
        run: |
          set -euo pipefail
          test "$CONFIRM" = 'PROVISION_BLACKGOLD_BEAUTY_INFRA'
          test -n "$CF_TOKEN"
          test -n "$CF_ACCOUNT"
          len=${#ADMIN_TOKEN}
          test "$len" -ge 32
          test "$len" -le 512
          echo "BLACKGOLD_PROVISION_EXECUTION_PREFLIGHT=PASS"

      - name: Plan or provision Cloudflare resources
        working-directory: blackgold-beauty-finds-novo
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BLACKGOLD_PROVISION_CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.execute }}" = "true" ]; then
            node tools/cloudflare_provision.mjs --execute
          else
            node tools/cloudflare_provision.mjs --plan
          fi

      - name: Configure production admin secret
        if: ${{ inputs.execute }}
        working-directory: blackgold-beauty-finds-novo
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BLACKGOLD_ADMIN_PANEL_TOKEN: ${{ secrets.BLACKGOLD_ADMIN_PANEL_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$BLACKGOLD_ADMIN_PANEL_TOKEN" | npx --yes wrangler@${WRANGLER_VERSION} pages secret put ADMIN_PANEL_TOKEN --project-name "$PROJECT_NAME"
          echo "BLACKGOLD_ADMIN_SECRET=CONFIGURED"

      - name: Apply new D1 schema
        if: ${{ inputs.execute }}
        working-directory: blackgold-beauty-finds-novo
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} d1 migrations apply "$D1_NAME" --remote
          echo "BLACKGOLD_D1_REMOTE_MIGRATIONS=PASS"

      - name: Commit resolved D1 binding
        if: ${{ inputs.execute }}
        shell: bash
        run: |
          set -euo pipefail
          git add blackgold-beauty-finds-novo/wrangler.toml
          if git diff --cached --quiet; then
            echo "wrangler.toml already contains the resolved D1 id."
            exit 0
          fi
          git config user.name "BlackGold Automation"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "infra(blackgold): bind provisioned production D1"
          git push origin HEAD:blackgold-beauty-finds-novo-authority

      - name: Upload provisioning receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blackgold-cloudflare-provision
          path: blackgold-beauty-finds-novo/.provision/cloudflare-provision.json
          if-no-files-found: error
          retention-days: 30

      - name: Explicit non-deploy assertion
        if: always()
        shell: bash
        run: |
          echo "This workflow provisions infrastructure only. It never deploys the site."
          echo "BLACKGOLD_PROVISION_NO_DEPLOY=PASS"
