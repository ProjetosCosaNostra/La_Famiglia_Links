name: BlackGold — Funcionário digital diário

on:
  schedule:
    - cron: "15 12 * * *"
  workflow_dispatch:
    inputs:
      max_posts:
        description: "Produtos publicados no Telegram nesta execução"
        required: true
        default: "1"
        type: choice
        options: ["1", "2", "3"]

permissions:
  contents: write

concurrency:
  group: blackgold-daily-employee
  cancel-in-progress: false

jobs:
  campaign:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do catálogo oficial
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
          persist-credentials: true

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ler resultados da vitrine
        continue-on-error: true
        env:
          CAMPAIGN_STATS_URL: ${{ secrets.CAMPAIGN_STATS_URL }}
          CAMPAIGN_STATS_TOKEN: ${{ secrets.CAMPAIGN_STATS_TOKEN }}
        run: python tools/fetch_campaign_stats.py

      - name: Escolher a Seleção do Dia e atualizar aprendizado
        run: python tools/blackgold_daily_employee.py --count 3

      - name: Publicar o melhor achado no Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_BASE: ${{ secrets.SITE_BASE }}
          MAX_POSTS: ${{ inputs.max_posts || '1' }}
        run: python tools/publish_daily_campaign.py --max-posts "${MAX_POSTS}"

      - name: Guardar campanha e memória de aprendizado
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- data/daily_selection.json data/campaign_learning.json data/campaign_stats.json data/daily_publish_state.json)" ]; then
            echo "Nenhuma mudança na campanha."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/daily_selection.json data/campaign_learning.json
          git add data/campaign_stats.json data/daily_publish_state.json 2>/dev/null || true
          git commit -m "campaign: seleção diária e aprendizado [skip ci]"
          git pull --rebase origin gh-pages
          git push origin HEAD:gh-pages
