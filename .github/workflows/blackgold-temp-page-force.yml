name: BlackGold Temporary Page - Force Verify

on:
  workflow_dispatch:
  push:
    branches:
      - blackgold-beauty-cloudflare
    paths:
      - '.github/workflows/blackgold-temp-page-force.yml'

permissions:
  contents: read

env:
  PROJECT_NAME: blackgold-beauty-finds-br
  STORE_URL: https://blackgold-beauty-finds-br.pages.dev
  WRANGLER_VERSION: 4.129.0
  DESKTOP_GIT_SHA: e843cf69b90ffab16eb4bf58298ea82889a0bb97
  MOBILE_GIT_SHA: cb74afede66c445dd445ae086217cee4c40e9f7b

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout production source
        uses: actions/checkout@v4
        with:
          ref: blackgold-beauty-cloudflare
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Resolve Cloudflare production branch
        id: project
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CF_TOKEN"
          test -n "$CF_ACCOUNT"
          curl -fsS \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/pages/projects/${PROJECT_NAME}" \
            -o /tmp/project.json
          node <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync('/tmp/project.json','utf8'));
          if (!body.success || !body.result) process.exit(2);
          const branch = body.result.production_branch;
          if (!branch) process.exit(3);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `production_branch=${branch}\n`);
          console.log(`Production branch: ${branch}`);
          NODE

      - name: Build and verify source package
        working-directory: cloudflare-beauty-finds
        run: |
          set -euo pipefail
          node build.mjs
          grep -F 'under-construction-desktop.webp?v=20260916-final' dist/index.html
          grep -F 'under-construction-mobile.webp?v=20260916-final' dist/index.html
          test "$(git hash-object dist/under-construction-desktop.webp)" = "${DESKTOP_GIT_SHA}"
          test "$(git hash-object dist/under-construction-mobile.webp)" = "${MOBILE_GIT_SHA}"
          test "$(stat -c%s dist/under-construction-desktop.webp)" -gt 50000
          test "$(stat -c%s dist/under-construction-mobile.webp)" -gt 50000

      - name: Deploy exact package to production
        working-directory: cloudflare-beauty-finds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PRODUCTION_BRANCH: ${{ steps.project.outputs.production_branch }}
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} pages deploy dist \
            --project-name="$PROJECT_NAME" \
            --branch="$PRODUCTION_BRANCH" \
            --commit-hash="$GITHUB_SHA" \
            --commit-dirty=true

      - name: Verify live production bytes
        shell: bash
        run: |
          set -euo pipefail
          sleep 10
          stamp="${GITHUB_SHA}-$(date +%s)"
          curl -fsSL -H 'Cache-Control: no-cache' "${STORE_URL}/?verify=${stamp}" -o /tmp/live-index.html
          curl -fsSL -H 'Cache-Control: no-cache' "${STORE_URL}/under-construction-desktop.webp?verify=${stamp}" -o /tmp/live-desktop.webp
          curl -fsSL -H 'Cache-Control: no-cache' "${STORE_URL}/under-construction-mobile.webp?verify=${stamp}" -o /tmp/live-mobile.webp
          grep -F 'under-construction-desktop.webp?v=20260916-final' /tmp/live-index.html
          grep -F 'under-construction-mobile.webp?v=20260916-final' /tmp/live-index.html
          test "$(git hash-object /tmp/live-desktop.webp)" = "${DESKTOP_GIT_SHA}"
          test "$(git hash-object /tmp/live-mobile.webp)" = "${MOBILE_GIT_SHA}"
          echo 'LIVE_PRODUCTION_VERIFIED=YES'
