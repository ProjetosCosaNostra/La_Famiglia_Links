name: CMS Produtos (Issue -> produtos.json)

on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: write
  issues: write

jobs:
  run-cms:
    if: contains(github.event.issue.labels.*.name, 'cms-produtos')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (gh-pages)
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run CMS
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          python tools/cms_produtos.py

      - name: Commit & push (if changed)
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add produtos.json
            git commit -m "chore(cms): update produtos.json from issue #${{ github.event.issue.number }}"
            git push
          else
            echo "No changes to commit."
          fi

      - name: Comment on issue
        uses: actions/github-script@v7
        with:
          script: |
            const n = context.payload.issue.number;
            const msg = [
              "✅ CMS executado.",
              "",
              "Se foi **novo/atualização**, `produtos.json` já foi atualizado e commitado.",
              "Agora aguarde 1–2 min e recarregue a vitrine.",
              "",
              "Se não refletiu, abra **Actions** e me mande o log do run."
            ].join("\n");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: n,
              body: msg
            });
