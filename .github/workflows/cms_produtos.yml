name: CMS Produtos (Issue -> produtos.json)

on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: blackgold-catalog-pipeline
  cancel-in-progress: false

jobs:
  run-cms:
    if: ${{ contains(github.event.issue.labels.*.name, 'cms-produtos') || contains(github.event.issue.labels.*.name, 'cms-produto-do-dia') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (gh-pages)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps (optional)
        run: |
          set -euo pipefail
          python -m pip install -U pip
          if [ -f tools/requirements.txt ]; then
            pip install -r tools/requirements.txt
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Install deps WebP (para imagens rápidas)
        run: |
          set -euo pipefail
          if [ -f scripts/otimizar_produtos_webp.py ] && [ -f scripts/requirements-webp.txt ]; then
            pip install -r scripts/requirements-webp.txt
          elif [ -f scripts/otimizar_produtos_webp.py ]; then
            echo "scripts/requirements-webp.txt não encontrado; tentando usar dependências já instaladas."
          else
            echo "scripts/otimizar_produtos_webp.py não encontrado; etapa WebP será ignorada."
          fi

      - name: Debug (versions + context)
        run: |
          set -euo pipefail
          python --version
          git --version
          echo "EVENT: ${{ github.event_name }} / issue #${{ github.event.issue.number }}"
          echo "LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}"
          ls -la
          ls -la tools || true
          ls -la scripts || true

      - name: Run CMS
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python tools/cms_produtos.py

      - name: Buscar foto limpa para o card do site novo
        continue-on-error: true
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          MELI_ACCESS_TOKEN: ${{ secrets.MELI_ACCESS_TOKEN }}
          MELI_CLIENT_ID: ${{ secrets.MELI_CLIENT_ID }}
          MELI_CLIENT_SECRET: ${{ secrets.MELI_CLIENT_SECRET }}
          MELI_REFRESH_TOKEN: ${{ secrets.MELI_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          python tools/sync_product_card_images.py \
            --input produtos.json \
            --out produtos.json \
            --event-path "${GITHUB_EVENT_PATH}" \
            --max-items 1 \
            --assets-dir assets/produtos-card \
            --report card-images-report.json \
            --new-refresh-token-file "${RUNNER_TEMP}/meli-refresh-token.txt"

      - name: Guardar o refresh token renovado com segurança
        if: always()
        env:
          GH_TOKEN: ${{ secrets.IMAGE_BOT_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TOKEN_FILE="${RUNNER_TEMP}/meli-refresh-token.txt"
          if [ ! -s "${TOKEN_FILE}" ]; then
            exit 0
          fi
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::IMAGE_BOT_GITHUB_TOKEN não configurado; o refresh token novo não pôde ser rotacionado."
            exit 0
          fi
          NEW_REFRESH_TOKEN="$(cat "${TOKEN_FILE}")"
          echo "::add-mask::${NEW_REFRESH_TOKEN}"
          gh secret set MELI_REFRESH_TOKEN \
            --repo "${GITHUB_REPOSITORY}" \
            --body "${NEW_REFRESH_TOKEN}"

      - name: Guardar relatório da foto limpa
        if: always() && hashFiles('card-images-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: card-image-cms-${{ github.event.issue.number }}
          path: card-images-report.json
          retention-days: 14

      - name: Otimizar imagens para WebP antes do commit
        run: |
          set -euo pipefail
          if [ -f scripts/otimizar_produtos_webp.py ]; then
            python scripts/otimizar_produtos_webp.py \
              --input produtos.json \
              --out produtos.json \
              --assets-dir assets/produtos-webp \
              --quality 78 \
              --max-size 1000 \
              --report webp-report.json
          else
            echo "scripts/otimizar_produtos_webp.py não encontrado; seguindo sem otimizar."
          fi

      - name: Validate produtos.json
        run: |
          set -euo pipefail
          test -f produtos.json
          python -m json.tool produtos.json >/dev/null

      - name: Commit & push (robusto)
        id: commit_push
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          ATTEMPT=1
          MAX_ATTEMPTS=3

          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
            echo "=== Commit/push attempt ${ATTEMPT}/${MAX_ATTEMPTS} ==="

            git checkout -B gh-pages
            git add -A

            if [ -n "$(git diff --cached --name-only)" ]; then
              git commit -m "cms: update produtos.json via issue #${{ github.event.issue.number }} [skip webp]"
            else
              echo "Nada staged para commit nesta tentativa."
            fi

            if git push origin HEAD:gh-pages; then
              echo "Push concluído com sucesso."
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Push rejeitado. Sincronizando com origin/gh-pages e reaplicando CMS + WebP..."
            git fetch origin gh-pages
            git reset --hard origin/gh-pages

            python tools/cms_produtos.py

            if [ -f scripts/otimizar_produtos_webp.py ]; then
              python scripts/otimizar_produtos_webp.py \
                --input produtos.json \
                --out produtos.json \
                --assets-dir assets/produtos-webp \
                --quality 78 \
                --max-size 1000 \
                --report webp-report.json
            fi

            test -f produtos.json
            python -m json.tool produtos.json >/dev/null

            if [ -z "$(git status --porcelain)" ]; then
              echo "Depois de sincronizar e reaplicar, não restaram mudanças locais."
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            ATTEMPT=$((ATTEMPT + 1))
            sleep 2
          done

          echo "ERRO: não foi possível publicar produtos.json após ${MAX_ATTEMPTS} tentativas."
          exit 1

      - name: Extrair SKU do issue (parser do CMS)
        if: steps.commit_push.outputs.changed == 'true'
        id: extract_sku
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          try:
              from tools.cms_produtos import _build_product_from_issue
          except Exception as exc:
              print(f"ERRO: não consegui importar o parser do CMS: {exc}", file=sys.stderr)
              raise

          issue = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8")).get("issue") or {}
          product = _build_product_from_issue(issue)
          sku = str(product.get("sku") or "").strip()

          if not sku:
              raise RuntimeError("SKU vazio após parse do issue.")

          print(f"SKU extraído do issue: {sku}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"sku={sku}\n")
          PY

      - name: Disparar Guardian focado no SKU (workflow_dispatch)
        if: steps.commit_push.outputs.changed == 'true' && steps.extract_sku.outputs.sku != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SKU: ${{ steps.extract_sku.outputs.sku }}
        run: |
          set -euo pipefail

          API="https://api.github.com/repos/${REPO}/actions/workflows/link_guardian.yml/dispatches"
          BODY="$(python - <<'PY'
          import json
          import os
          print(json.dumps({
              'ref': 'gh-pages',
              'inputs': {
                  'modo': 'sku',
                  'sku': os.environ['SKU'],
              }
          }, ensure_ascii=False))
          PY
          )"

          echo "Dispatching Guardian: ${API}"
          echo "SKU alvo: ${SKU}"
          HTTP_CODE="$(curl -sS -o /tmp/guardian_dispatch_resp.txt -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "${API}" \
            -d "${BODY}")"

          if [ "${HTTP_CODE}" = "204" ]; then
            echo "OK: Guardian workflow disparado para o SKU ${SKU}."
            exit 0
          fi

          echo "ERRO: dispatch do Guardian retornou HTTP ${HTTP_CODE}"
          echo "Resposta:"
          cat /tmp/guardian_dispatch_resp.txt || true
          exit 1

      - name: Disparar Telegram (workflow_dispatch)
        if: steps.commit_push.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          API="https://api.github.com/repos/${REPO}/actions/workflows/telegram_produtos.yml/dispatches"
          BODY='{"ref":"gh-pages","inputs":{"modo":"novos","max_posts":"8"}}'

          echo "Dispatching: ${API}"
          HTTP_CODE="$(curl -sS -o /tmp/dispatch_resp.txt -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "${API}" \
            -d "${BODY}")"

          if [ "${HTTP_CODE}" = "204" ]; then
            echo "OK: Telegram workflow disparado."
            exit 0
          fi

          echo "ERRO: dispatch retornou HTTP ${HTTP_CODE}"
          echo "Resposta:"
          cat /tmp/dispatch_resp.txt || true
          exit 1
