name: CMS Produtos (Issue -> produtos.json)

on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: cms-produtos
  cancel-in-progress: true

jobs:
  run-cms:
    if: contains(join(github.event.issue.labels.*.name, ','), 'cms-produtos')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (gh-pages)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps (optional)
        run: |
          set -euo pipefail
          python -m pip install -U pip
          if [ -f tools/requirements.txt ]; then
            pip install -r tools/requirements.txt
          fi

      - name: Debug (versions + context)
        run: |
          set -euo pipefail
          python --version
          git --version
          echo "EVENT: ${{ github.event_name }} / issue #${{ github.event.issue.number }}"
          echo "LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}"
          ls -la
          ls -la tools || true

      - name: Run CMS
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python tools/cms_produtos.py

      - name: Validate produtos.json
        run: |
          set -euo pipefail
          test -f produtos.json
          python -m json.tool produtos.json >/dev/null

      - name: Commit & push (robusto)
        id: commit_push
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          ATTEMPT=1
          MAX_ATTEMPTS=3

          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
            echo "=== Commit/push attempt ${ATTEMPT}/${MAX_ATTEMPTS} ==="

            git checkout -B gh-pages
            git add -A

            if [ -n "$(git diff --cached --name-only)" ]; then
              git commit -m "cms: update produtos.json via issue #${{ github.event.issue.number }}"
            else
              echo "Nada staged para commit nesta tentativa."
            fi

            if git push origin HEAD:gh-pages; then
              echo "Push concluído com sucesso."
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Push rejeitado. Sincronizando com origin/gh-pages e reaplicando CMS..."
            git fetch origin gh-pages
            git reset --hard origin/gh-pages

            python tools/cms_produtos.py
            test -f produtos.json
            python -m json.tool produtos.json >/dev/null

            if [ -z "$(git status --porcelain)" ]; then
              echo "Depois de sincronizar e reaplicar, não restaram mudanças locais."
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            ATTEMPT=$((ATTEMPT + 1))
            sleep 2
          done

          echo "ERRO: não foi possível publicar produtos.json após ${MAX_ATTEMPTS} tentativas."
          exit 1

      - name: Disparar Telegram (workflow_dispatch)
        if: steps.commit_push.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          API="https://api.github.com/repos/${REPO}/actions/workflows/telegram_produtos.yml/dispatches"
          BODY='{"ref":"gh-pages","inputs":{"modo":"novos","max_posts":"8"}}'

          echo "Dispatching: ${API}"
          HTTP_CODE="$(curl -sS -o /tmp/dispatch_resp.txt -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "${API}" \
            -d "${BODY}")"

          if [ "${HTTP_CODE}" = "204" ]; then
            echo "OK: Telegram workflow disparado."
            exit 0
          fi

          echo "ERRO: dispatch retornou HTTP ${HTTP_CODE}"
          echo "Resposta:"
          cat /tmp/dispatch_resp.txt || true
          exit 1
