name: CMS Produtos (Issue -> produtos.json)

on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: write
  issues: write
  actions: write  # ✅ necessário para disparar outro workflow (workflow_dispatch)

# evita 2 runs se atropelarem (principal causa de "criei e não atualizou")
concurrency:
  group: cms-produtos
  cancel-in-progress: true

jobs:
  run-cms:
    if: contains(join(github.event.issue.labels.*.name, ','), 'cms-produtos')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (gh-pages)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps (optional)
        run: |
          set -euo pipefail
          python -m pip install -U pip
          if [ -f tools/requirements.txt ]; then
            pip install -r tools/requirements.txt
          fi

      - name: Debug (versions + context)
        run: |
          set -euo pipefail
          python --version
          git --version
          echo "EVENT: ${{ github.event_name }} / issue #${{ github.event.issue.number }}"
          echo "LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}"
          ls -la
          ls -la tools || true

      - name: Run CMS
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python tools/cms_produtos.py

      - name: Validate produtos.json
        run: |
          set -euo pipefail
          test -f produtos.json
          python -m json.tool produtos.json >/dev/null

      - name: Commit & push (if changed)
        id: commit_push
        run: |
          set -euo pipefail

          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            # garante branch local consistente (evita push falhar em detached HEAD)
            git checkout -B gh-pages

            git add -A
            git commit -m "cms: update produtos.json via issue #${{ github.event.issue.number }}"

            # push robusto: empurra o HEAD atual para gh-pages
            git push origin HEAD:gh-pages

            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Disparar Telegram (workflow_dispatch)
        if: steps.commit_push.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Dispara o workflow do Telegram manualmente via API
          API="https://api.github.com/repos/${REPO}/actions/workflows/telegram_produtos.yml/dispatches"

          # Se o workflow tiver inputs, pode mandar. Se não tiver, o GitHub ignora inputs ausentes.
          BODY='{"ref":"gh-pages","inputs":{"modo":"novos"}}'

          echo "Dispatching: ${API}"
          HTTP_CODE="$(curl -sS -o /tmp/dispatch_resp.txt -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "${API}" \
            -d "${BODY}")"

          if [ "${HTTP_CODE}" = "204" ]; then
            echo "OK: Telegram workflow disparado."
            exit 0
          fi

          echo "ERRO: dispatch retornou HTTP ${HTTP_CODE}"
          echo "Resposta:"
          cat /tmp/dispatch_resp.txt || true
          exit 1
