name: Link Guardian — Gerar JSON de Relink

on:
  workflow_dispatch:
    inputs:
      source_txt:
        description: 'Arquivo TXT de manutenção gerado pelo Link Guardian'
        required: true
        default: 'logs/link_guardian_review.txt'
        type: string
      output_json:
        description: 'Arquivo JSON que será gerado para baixar/preencher'
        required: true
        default: 'logs/link_guardian_relink_lote.json'
        type: string
      commit_changes:
        description: 'Salvar o JSON gerado no repositório?'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  gerar-json:
    name: Gerar template JSON do Link Guardian
    runs-on: ubuntu-latest

    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gerar JSON de relink
        run: |
          python tools/link_guardian_review_to_json.py \
            --source "${{ inputs.source_txt }}" \
            --output "${{ inputs.output_json }}"

      - name: Mostrar JSON gerado
        run: |
          echo '========================================'
          echo 'JSON DE RELINK GERADO'
          echo '========================================'
          cat "${{ inputs.output_json }}"

      - name: Commit do JSON gerado
        if: ${{ inputs.commit_changes == true }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${{ inputs.output_json }}"
          if git diff --cached --quiet; then
            echo 'Sem alterações para commit.'
          else
            git commit -m 'Link Guardian: gerar JSON de relink'
            git push origin gh-pages
          fi
