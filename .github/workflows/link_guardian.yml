name: Link Guardian (produtos.json)

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 */6 * * *"   # a cada 6 horas (UTC)

permissions:
  contents: write

jobs:
  link-guardian:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (gh-pages)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Link Guardian
        env:
          LG_TIMEOUT_SEC: "12"
          LG_SLEEP_SEC: "0.35"
          LG_MAX_CHECK: "60"

          LG_CONSERVATIVE_ON_BLOCK: "1"
          LG_TREAT_5XX_TEMP: "1"

          LG_FAIL_THRESHOLD: "2"
          LG_AUTO_REACTIVATE: "0"
          LG_REMOVE_ON_DEAD: "0"

          # FAILSAFE anti-wipe (NUNCA mais zera a loja)
          LG_FAILSAFE_MIN_ACTIVE: "10"
          LG_FAILSAFE_MIN_RATIO: "0.35"

          # RESTORE (deixe 0 normalmente; se der merda, mude pra 1 e rode 1 vez)
          LG_RESTORE_DISABLED: "0"
          LG_RESTORE_DISABLED_HOURS: "72"
        run: |
          python tools/link_guardian.py

      - name: Commit & push (if changed)
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add produtos.json
            git commit -m "chore: Link Guardian update produtos.json"
            git push origin gh-pages
          else
            echo "No changes."
          fi
