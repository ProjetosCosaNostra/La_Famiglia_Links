name: Link Guardian (produtos.json)

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 */6 * * *"   # a cada 6 horas (UTC)

# evita rodar dois Link Guardian ao mesmo tempo
concurrency:
  group: link-guardian-produtos-json
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  link-guardian:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (gh-pages)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Link Guardian
        env:
          LG_TIMEOUT_SEC: "12"
          LG_SLEEP_SEC: "0.25"
          LG_MAX_CHECK: "80"

          LG_CONSERVATIVE_ON_BLOCK: "1"
          LG_TREAT_5XX_TEMP: "1"
          LG_FAIL_THRESHOLD: "2"

          # RECOMENDADO (seguro): só desativa (vitrine fica limpa)
          LG_REMOVE_ON_DEAD: "0"

          # Se você quiser “sumir do JSON” de vez, mude para "1"
          # LG_REMOVE_ON_DEAD: "1"

          LG_AUTO_REACTIVATE: "0"
        run: |
          python tools/link_guardian.py

      - name: Commit & push (if changed)
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add produtos.json
            git commit -m "chore: Link Guardian update produtos.json"
            git push origin gh-pages
          else
            echo "No changes."
          fi
