name: Link Guardian (produtos.json)

"on":
  workflow_dispatch:
    inputs:
      sku:
        description: "SKU único para rerun focado (opcional)"
        required: false
        type: string
        default: ""
      modo:
        description: "Modo de execução"
        required: false
        type: choice
        default: full
        options:
          - full
          - sku
  schedule:
    - cron: "0 */6 * * *"   # a cada 6 horas (UTC)

permissions:
  contents: write
  actions: read

concurrency:
  group: link-guardian-gh-pages
  cancel-in-progress: true

jobs:
  link-guardian:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (gh-pages)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Link Guardian
        env:
          LG_TIMEOUT_SEC: "12"
          LG_SLEEP_SEC: "0.35"
          LG_MAX_CHECK: "300"
          LG_MAX_CANDIDATE_URLS: "5"

          LG_CONSERVATIVE_ON_BLOCK: "1"
          LG_TREAT_5XX_TEMP: "1"
          LG_DEAD_ON_BODY: "0"

          # Mais conservador para reduzir falso positivo
          LG_FAIL_THRESHOLD: "3"
          LG_STOREFRONT_INVALID_THRESHOLD: "3"
          LG_AUTO_REACTIVATE: "1"
          LG_REMOVE_ON_DEAD: "0"

          # Alinhado com a lógica por evidência do Python:
          # - perfil social pode ser válido
          # - /lists continua sendo sinal real de problema
          # - o Python decide com base em evidência do produto
          LG_SOCIAL_INVALID_FOR_STOREFRONT: "0"
          LG_LISTA_INVALID_FOR_STOREFRONT: "1"
          LG_SOCIAL_COUNTS_AS_OK: "1"
          LG_STOREFRONT_REVIEW_ONLY: "1"

          LG_RECOVER_ON_TEMP: "1"
          LG_RECOVER_MAX_DAYS: "90"

          LG_BOOTSTRAP_IF_ZERO: "1"
          LG_BOOTSTRAP_MAX_DAYS: "180"
          LG_FORCE_RESTORE_ALL_IF_ZERO: "1"

          LG_FAILSAFE_MIN_ACTIVE: "10"
          LG_FAILSAFE_MIN_RATIO: "0.35"

          LG_REMOVED_MAX_EVENTS: "5000"
          LG_REVIEW_MAX_ITEMS: "5000"

          # Preparação para rerun focado por SKU.
          # O consumo efetivo destes envs será fechado no tools/link_guardian.py.
          LG_ONLY_SKU: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.sku || '' }}
          LG_RUN_MODE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.modo || 'full' }}
        run: |
          python tools/link_guardian.py

      - name: Upload review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-guardian-review
          if-no-files-found: ignore
          retention-days: 7
          path: |
            data/link_guardian_review.json
            logs/link_guardian_review.txt
            data/link_guardian_removed.json
            logs/link_guardian_removed.txt
            data/link_guardian_memory.json

      - name: Commit & push (if changed)
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            git add produtos.json

            if [ -f data/link_guardian_memory.json ]; then
              git add data/link_guardian_memory.json
            fi

            if [ -f data/link_guardian_removed.json ]; then
              git add data/link_guardian_removed.json
            fi

            if [ -f logs/link_guardian_removed.txt ]; then
              git add logs/link_guardian_removed.txt
            fi

            if [ -f data/link_guardian_review.json ]; then
              git add data/link_guardian_review.json
            fi

            if [ -f logs/link_guardian_review.txt ]; then
              git add logs/link_guardian_review.txt
            fi

            git commit -m "chore: Link Guardian update produtos.json"
            git push origin gh-pages
          else
            echo "No changes."
          fi
