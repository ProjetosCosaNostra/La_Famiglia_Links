name: Link Guardian (produtos.json)

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 */6 * * *" # a cada 6 horas (UTC)

permissions:
  contents: write

# Evita corrida (2 runs simultâneos) causando conflitos no push do produtos.json
concurrency:
  group: link-guardian-gh-pages
  cancel-in-progress: true

jobs:
  link-guardian:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout (gh-pages)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Debug info
        run: |
          set -euo pipefail
          python --version
          git --version
          echo "Branch:"
          git rev-parse --abbrev-ref HEAD
          echo "Files:"
          ls -la

      - name: Run Link Guardian
        env:
          # ====== Performance / anti-bloqueio ======
          LG_TIMEOUT_SEC: "12"
          LG_SLEEP_SEC: "0.25"
          LG_MAX_CHECK: "80"

          # ====== Segurança contra falso-positivo ======
          LG_FAIL_THRESHOLD: "2"           # só desativa após 2 falhas reais seguidas
          LG_CONSERVATIVE_ON_BLOCK: "1"    # 403/429 => TEMP (não derruba)
          LG_TREAT_5XX_TEMP: "1"           # 5xx/timeout => TEMP (não derruba)

          # ====== Política ======
          LG_AUTO_REACTIVATE: "0"          # não reativar automaticamente
          LG_REMOVE_ON_DEAD: "0"           # 0 = só desativar (recomendado). 1 = remover do JSON (irreversível)
        run: |
          set -euo pipefail
          python tools/link_guardian.py

      - name: Validate produtos.json
        run: |
          set -euo pipefail
          test -f produtos.json
          python -m json.tool produtos.json >/dev/null
          echo "OK: produtos.json válido."

      - name: Commit & push (if changed)
        run: |
          set -euo pipefail

          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            git add produtos.json

            # Mensagem com data/hora UTC pra rastrear
            git commit -m "chore: link-guardian update produtos.json (UTC $(date -u +'%Y-%m-%d %H:%M'))"

            # Push robusto para o branch correto
            git push origin HEAD:gh-pages
          else
            echo "No changes."
          fi
