name: Diagnostico seguro API Mercado Livre

on:
  workflow_dispatch:
  push:
    branches: [gh-pages]
    paths:
      - '.github/workflows/meli-api-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Testar token, busca anônima e resolução pública sem expor credenciais
        env:
          MELI_ACCESS_TOKEN: ${{ secrets.MELI_ACCESS_TOKEN }}
          MELI_APP_ID: ${{ secrets.MELI_CLIENT_ID }}
        shell: python
        run: |
          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request

          token = (os.environ.get("MELI_ACCESS_TOKEN") or "").strip()
          app_id = (os.environ.get("MELI_APP_ID") or "").strip()
          if not token or not app_id:
              raise SystemExit("Secrets MELI_ACCESS_TOKEN/MELI_CLIENT_ID ausentes")

          base = "https://api.mercadolibre.com"
          browser_ua = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36"
          auth_headers = {"Authorization": f"Bearer {token}", "Accept": "application/json", "User-Agent": "BlackGoldBeautyDiagnostic/1.1"}
          anon_headers = {"Accept": "application/json", "User-Agent": browser_ua}

          def read_url(label, url, headers):
              req = urllib.request.Request(url, headers=headers, method="GET")
              try:
                  with urllib.request.urlopen(req, timeout=25) as r:
                      raw = r.read().decode("utf-8", "replace")
                      status = r.status
                      final_url = r.geturl()
              except urllib.error.HTTPError as e:
                  raw = e.read().decode("utf-8", "replace")
                  status = e.code
                  final_url = e.geturl()
              except Exception as e:
                  print(f"{label}: transport_error={type(e).__name__}")
                  return None, "", ""
              parsed = urllib.parse.urlparse(final_url)
              ids = sorted(set(re.findall(r"(?i)\bMLB[-_]?\d{6,}\b", raw + " " + final_url)))[:8]
              safe = {"http": status, "host": parsed.netloc, "path": parsed.path, "bytes": len(raw.encode('utf-8')), "mlb_ids": ids}
              try:
                  data = json.loads(raw) if raw else {}
              except Exception:
                  data = None
              if isinstance(data, dict):
                  for key in ("error", "message", "status", "code", "active", "site_id", "id"):
                      val = data.get(key)
                      if isinstance(val, (str, int, float, bool)):
                          safe[key] = val
                  results = data.get("results")
                  if isinstance(results, list):
                      safe["results_count"] = len(results)
                      if results and isinstance(results[0], dict):
                          first = results[0]
                          safe["first_id"] = first.get("id")
                          safe["first_title"] = str(first.get("title") or "")[:120]
              print(label + ": " + json.dumps(safe, ensure_ascii=False))
              return data if 200 <= status < 300 else None, raw, final_url

          me, _, _ = read_url("users_me", base + "/users/me", auth_headers)
          read_url("application", base + f"/applications/{urllib.parse.quote(app_id)}", auth_headers)
          query = urllib.parse.urlencode({"q": "gloss labial fantasyland disney 100 bruna tavares", "limit": 3})
          read_url("search_authenticated", base + "/sites/MLB/search?" + query, auth_headers)
          read_url("search_anonymous", base + "/sites/MLB/search?" + query, anon_headers)

          for label, url in (
              ("short_affiliate", "https://meli.la/2Fomd6F"),
              ("list_id_busca", "https://lista.mercadolivre.com.br/5J5PKG-EG46"),
              ("list_title", "https://lista.mercadolivre.com.br/gloss-labial-fantasyland-disney-100-anos-bruna-tavares"),
          ):
              read_url(label, url, {"Accept": "text/html,application/xhtml+xml,*/*;q=0.8", "User-Agent": browser_ua, "Accept-Language": "pt-BR,pt;q=0.9"})

          if isinstance(me, dict) and me.get("id"):
              user_id = str(me["id"])
              own, _, _ = read_url("seller_items_search", base + f"/users/{urllib.parse.quote(user_id)}/items/search?limit=1", auth_headers)
              if isinstance(own, dict):
                  results = own.get("results")
                  if isinstance(results, list) and results:
                      item_id = str(results[0])
                      if item_id:
                          read_url("seller_item_detail", base + f"/items/{urllib.parse.quote(item_id)}", auth_headers)
