name: Fotos limpas dos produtos

on:
  workflow_dispatch:
    inputs:
      max_items:
        description: "Quantidade máxima de produtos nesta rodada"
        required: true
        default: "73"
      refresh:
        description: "Refazer também as fotos que já existem"
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "27 3 * * *"
  push:
    branches: [gh-pages]
    paths:
      - "produtos.json"
      - "tools/sync_product_card_images.py"
      - "tests/test_sync_product_card_images.py"
      - ".github/workflows/sync-product-card-images.yml"

permissions:
  contents: write

concurrency:
  group: blackgold-catalog-pipeline
  cancel-in-progress: false

jobs:
  sync-images:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar catálogo canônico
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.IMAGE_BOT_GITHUB_TOKEN }}

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Ativar buscador oficial de produtos de catálogo
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/sync_product_card_images.py')
          text = path.read_text(encoding='utf-8')

          if '    def catalog_search(self, title: str, limit: int = 20)' not in text:
              anchor = '    def search(self, title: str, limit: int = 20) -> list[dict[str, Any]]:\n'
              method = "\n".join([
                  '    def catalog_search(self, title: str, limit: int = 20) -> list[dict[str, Any]]:',
                  '        """Busca produtos de catálogo pelo endpoint oficial /products/search."""',
                  '        try:',
                  '            payload = self.get_json(',
                  '                "/products/search",',
                  '                {"status": "active", "site_id": "MLB", "q": title, "limit": limit},',
                  '            ) or {}',
                  '        except AuthenticationRequired as exc:',
                  '            if "(403)" in str(exc):',
                  '                return []',
                  '            raise',
                  '        results = payload.get("results")',
                  '        return [item for item in results if isinstance(item, dict)] if isinstance(results, list) else []',
                  '',
              ])
              if anchor not in text:
                  raise SystemExit('Âncora de catalog_search não encontrada.')
              text = text.replace(anchor, method + anchor, 1)

          if '\ndef catalog_search_match(' not in text:
              anchor = '\n\ndef search_match(product: dict[str, Any], client: MercadoLivreClient, min_score: float) -> Match | None:\n'
              helper = "\n".join([
                  '',
                  '',
                  'def catalog_search_match(product: dict[str, Any], client: MercadoLivreClient, min_score: float) -> Match | None:',
                  '    """Busca no catálogo oficial e mantém o mesmo filtro conservador de título/variante."""',
                  '    source_title = str(product.get("title") or "").strip()',
                  '    if not source_title:',
                  '        return None',
                  '',
                  '    ranked = _rank_safe_candidates(source_title, client.catalog_search(source_title), min_score)',
                  '    if not ranked:',
                  '        return None',
                  '    top_score, top = ranked',
                  '    product_id = str(top.get("id") or top.get("catalog_product_id") or "").strip()',
                  '    if not product_id:',
                  '        return None',
                  '    detail = client.catalog_product(product_id) or top',
                  '    if title_match_score(source_title, candidate_title(detail) or candidate_title(top)) < min_score:',
                  '        return None',
                  '    return match_from_item(detail, "catalog-title-search", top_score)',
              ])
              if anchor not in text:
                  raise SystemExit('Âncora de catalog_search_match não encontrada.')
              text = text.replace(anchor, helper + anchor, 1)

          old = '        or affiliate_page_match(product, client, min_score)\n        or search_match(product, client, min_score)'
          new = '        or affiliate_page_match(product, client, min_score)\n        or catalog_search_match(product, client, min_score)\n        or search_match(product, client, min_score)'
          if old in text:
              text = text.replace(old, new, 1)
          elif 'or catalog_search_match(product, client, min_score)' not in text:
              raise SystemExit('Bloco resolve_match esperado não encontrado.')
          path.write_text(text, encoding='utf-8')

          tests = Path('tests/test_sync_product_card_images.py')
          test_text = tests.read_text(encoding='utf-8')
          if '    catalog_search_match,\n' not in test_text:
              needle = '    catalog_product_ids_from_html,\n'
              if needle not in test_text:
                  raise SystemExit('Import de teste esperado não encontrado.')
              test_text = test_text.replace(needle, needle + '    catalog_search_match,\n', 1)

          if 'class FakeCatalogClient:' not in test_text:
              anchor = '\n\nclass FakeAffiliateClient:\n'
              fake = "\n".join([
                  '',
                  '',
                  'class FakeCatalogClient:',
                  '    def __init__(self, results: list[dict], details: dict[str, dict]) -> None:',
                  '        self.results = results',
                  '        self.details = details',
                  '',
                  '    def catalog_search(self, title: str, limit: int = 20) -> list[dict]:',
                  '        del title, limit',
                  '        return self.results',
                  '',
                  '    def catalog_product(self, product_id: str) -> dict | None:',
                  '        return self.details.get(product_id)',
              ])
              if anchor not in test_text:
                  raise SystemExit('Âncora de FakeCatalogClient não encontrada.')
              test_text = test_text.replace(anchor, fake + anchor, 1)

          if 'def test_catalog_search_chooses_exact_product' not in test_text:
              anchor = '    def test_affiliate_page_chooses_exact_catalog_product(self) -> None:\n'
              case = "\n".join([
                  '    def test_catalog_search_chooses_exact_product(self) -> None:',
                  '        source = {"title": "Gloss Fran Liphoney Mel 5ml"}',
                  '        results = [',
                  '            {"id": "MLB27770001", "name": "Gloss Fran Liphoney Mel 5 ml"},',
                  '            {"id": "MLB27770002", "name": "Gloss Fran Liphoney Morango 5 ml"},',
                  '        ]',
                  '        details = {',
                  '            "MLB27770001": {',
                  '                "id": "MLB27770001",',
                  '                "name": "Gloss Fran Liphoney Mel 5 ml",',
                  '                "pictures": [{"secure_url": "https://http2.mlstatic.com/catalog-clean.jpg"}],',
                  '            }',
                  '        }',
                  '        match = catalog_search_match(source, FakeCatalogClient(results, details), 0.78)',
                  '        self.assertIsNotNone(match)',
                  '        self.assertEqual(match.item_id, "MLB27770001")',
                  '',
                  '',
              ])
              if anchor not in test_text:
                  raise SystemExit('Âncora do teste de catálogo não encontrada.')
              test_text = test_text.replace(anchor, case + anchor, 1)
          tests.write_text(test_text, encoding='utf-8')
          print('Buscador oficial /products/search preparado sem reduzir o limiar de segurança.')
          PY

      - name: Instalar dependências de imagem
        run: pip install -r scripts/requirements-webp.txt

      - name: Testar identificação, variantes e formato
        run: python -m unittest discover -s tests -p 'test_sync_product_card_images.py' -v

      - name: Validar credenciais e rotação segura antes de consumir refresh token
        env:
          MELI_ACCESS_TOKEN: ${{ secrets.MELI_ACCESS_TOKEN }}
          MELI_CLIENT_ID: ${{ secrets.MELI_CLIENT_ID }}
          MELI_CLIENT_SECRET: ${{ secrets.MELI_CLIENT_SECRET }}
          MELI_REFRESH_TOKEN: ${{ secrets.MELI_REFRESH_TOKEN }}
          IMAGE_BOT_GITHUB_TOKEN: ${{ secrets.IMAGE_BOT_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in MELI_ACCESS_TOKEN MELI_CLIENT_ID MELI_CLIENT_SECRET MELI_REFRESH_TOKEN IMAGE_BOT_GITHUB_TOKEN; do
            if [ -z "${!name:-}" ]; then
              missing+=("${name}")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::Secrets ausentes: %s. A sincronização foi bloqueada antes de qualquer refresh.\n' "${missing[*]}"
            exit 1
          fi
          echo "Preflight OAuth/rotação: OK"

      - name: Localizar, validar e salvar fotos limpas
        env:
          MELI_ACCESS_TOKEN: ${{ secrets.MELI_ACCESS_TOKEN }}
          MELI_CLIENT_ID: ${{ secrets.MELI_CLIENT_ID }}
          MELI_CLIENT_SECRET: ${{ secrets.MELI_CLIENT_SECRET }}
          MELI_REFRESH_TOKEN: ${{ secrets.MELI_REFRESH_TOKEN }}
          MAX_ITEMS: ${{ inputs.max_items || '73' }}
          REFRESH: ${{ inputs.refresh || 'false' }}
        run: |
          set -euo pipefail
          ARGS=(
            --input produtos.json
            --out produtos.json
            --assets-dir assets/produtos-card
            --report card-images-report.json
            --max-items "${MAX_ITEMS}"
            --new-refresh-token-file "${RUNNER_TEMP}/meli-refresh-token.txt"
          )
          if [ "${REFRESH}" = "true" ]; then
            ARGS+=(--refresh)
          fi
          python tools/sync_product_card_images.py "${ARGS[@]}"

      - name: Mostrar diagnóstico seguro da rodada
        if: always() && hashFiles('card-images-report.json') != ''
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('card-images-report.json').read_text(encoding='utf-8'))
          keys = ('selected','attempted','updated','skipped_existing','unresolved','failed','authentication_required','token_refreshed')
          print('Fotos limpas:', ' '.join(f'{key}={report.get(key)}' for key in keys))
          for row in report.get('results', [])[:10]:
              safe = {key: row.get(key) for key in ('sku','status','method','score','reason') if row.get(key) not in (None, '')}
              print(json.dumps(safe, ensure_ascii=False))
          PY

      - name: Guardar o refresh token renovado com segurança
        if: always()
        env:
          GH_TOKEN: ${{ secrets.IMAGE_BOT_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TOKEN_FILE="${RUNNER_TEMP}/meli-refresh-token.txt"
          if [ ! -s "${TOKEN_FILE}" ]; then
            exit 0
          fi
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::IMAGE_BOT_GITHUB_TOKEN não configurado; rotação segura indisponível."
            exit 1
          fi
          NEW_REFRESH_TOKEN="$(cat "${TOKEN_FILE}")"
          echo "::add-mask::${NEW_REFRESH_TOKEN}"
          gh secret set MELI_REFRESH_TOKEN \
            --repo "${GITHUB_REPOSITORY}" \
            --body "${NEW_REFRESH_TOKEN}"

      - name: Guardar relatório da rodada
        if: always() && hashFiles('card-images-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: card-images-report-${{ github.run_number }}
          path: card-images-report.json
          retention-days: 14

      - name: Publicar buscador e imagens aprovadas no catálogo
        run: |
          set -euo pipefail
          git add produtos.json tools/sync_product_card_images.py tests/test_sync_product_card_images.py
          if [ -d assets/produtos-card ]; then
            git add assets/produtos-card
          fi
          if git diff --cached --quiet; then
            echo "Nenhuma foto nova segura nem alteração do buscador nesta rodada."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "catalog: usar buscador oficial e atualizar fotos limpas"

          ATTEMPT=1
          while [ "${ATTEMPT}" -le 3 ]; do
            git fetch origin gh-pages
            git rebase origin/gh-pages
            if git push origin HEAD:gh-pages; then
              exit 0
            fi
            ATTEMPT=$((ATTEMPT + 1))
          done
          echo "Não foi possível publicar as alterações após 3 tentativas."
          exit 1
