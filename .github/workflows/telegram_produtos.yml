name: Telegram — Notificar produto novo

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "novos = posta só SKUs nunca postados | backfill = posta todos os ativos que ainda não foram postados | teste = força 1 post"
        required: true
        default: "novos"
        type: choice
        options:
          - novos
          - backfill
          - teste
      max_posts:
        description: "Limite de posts por execução (evita spam). Ex: 8 (normal) / 50 (backfill)"
        required: true
        default: "8"
        type: number

concurrency:
  group: telegram-produtos
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (gh-pages com histórico)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Detectar SKUs não-postados e postar no Telegram (com estado persistente)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_BASE: ${{ secrets.SITE_BASE }}
          MODE: ${{ inputs.modo }}
          MAX_POSTS: ${{ inputs.max_posts }}
        run: |
          python - <<'PY'
          import os, json, re, urllib.parse, urllib.request
          from datetime import datetime
          from pathlib import Path

          BOT = (os.getenv("TELEGRAM_BOT_TOKEN") or "").strip()
          CHAT = (os.getenv("TELEGRAM_CHAT_ID") or "").strip()
          SITE_BASE = (os.getenv("SITE_BASE") or "").strip()
          MODE = (os.getenv("MODE") or "novos").strip().lower()
          MAX_POSTS = int(float(os.getenv("MAX_POSTS") or "8"))

          if not BOT or not CHAT:
            raise SystemExit("Faltam secrets TELEGRAM_BOT_TOKEN ou TELEGRAM_CHAT_ID.")

          def infer_site_base():
            repo = (os.getenv("GITHUB_REPOSITORY") or "").strip()
            if "/" in repo:
              owner, name = repo.split("/", 1)
              return f"https://{owner.lower()}.github.io/{name}/"
            return ""

          if not SITE_BASE:
            SITE_BASE = infer_site_base()

          def tg_call(method: str, payload: dict):
            url = f"https://api.telegram.org/bot{BOT}/{method}"
            data = urllib.parse.urlencode(payload).encode("utf-8")
            req = urllib.request.Request(url, data=data)
            with urllib.request.urlopen(req, timeout=25) as r:
              return r.read()

          def tg_send_message(html: str):
            return tg_call("sendMessage", {
              "chat_id": CHAT,
              "text": html,
              "parse_mode": "HTML",
              "disable_web_page_preview": "false"
            })

          def tg_send_photo(photo_url: str, caption_html: str):
            return tg_call("sendPhoto", {
              "chat_id": CHAT,
              "photo": photo_url,
              "caption": caption_html[:1024],
              "parse_mode": "HTML"
            })

          def load_products_from(obj):
            if isinstance(obj, list):
              return obj
            if isinstance(obj, dict):
              for k in ("products", "items", "produtos", "data"):
                v = obj.get(k)
                if isinstance(v, list):
                  return v
            return []

          def safe(s):
            s = "" if s is None else str(s)
            return (s.replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;")
                     .replace('"', "&quot;").replace("'", "&#039;"))

          def ensure_http(u: str) -> str:
            u = (u or "").strip()
            if not u:
              return ""
            u = re.sub(r'^[\s"\'`]+', "", u)
            u = re.sub(r'[\s"\'`]+$', "", u)
            if re.match(r"^https?://", u, re.I):
              return u
            if u.startswith("//"):
              return "https:" + u
            if u.startswith("meli.la/") or u.startswith("meli.co/"):
              return "https://" + u
            if re.match(r"^(mercadolivre|mercadolibre)\.", u, re.I):
              return "https://" + u
            if re.match(r"^meli\.", u, re.I):
              return "https://" + u
            return u

          def best_buy(p: dict) -> str:
            for k in ("buy_url", "open_url", "check_url", "canonical_url", "short_url", "resolved_url", "link", "url"):
              v = ensure_http(p.get(k, ""))
              if v.startswith("http"):
                return v
            return ""

          def abs_image(img: str) -> str:
            img = (img or "").strip()
            if not img:
              return ""
            if img.startswith("http://") or img.startswith("https://"):
              return img
            base = SITE_BASE or ""
            if not base:
              return ""
            if not base.endswith("/"):
              base += "/"
            img = img.lstrip("./")
            return base + img

          def sku_of(p):
            return (p.get("sku") or p.get("slug") or "").strip()

          def is_active(p):
            if "active" in p:
              return bool(p.get("active"))
            if "ativo" in p:
              return bool(p.get("ativo"))
            return True

          def get_recency(p):
            for k in ("last_ok", "updated_at", "updatedAt", "created_at", "createdAt"):
              v = p.get(k)
              if v:
                return str(v)
            return ""

          state_path = Path("data") / "telegram_posted.json"
          state_path.parent.mkdir(parents=True, exist_ok=True)

          posted = set()
          state_obj = {}
          if state_path.exists():
            try:
              state_obj = json.loads(state_path.read_text("utf-8"))
              for s in state_obj.get("posted", []):
                if isinstance(s, str) and s.strip():
                  posted.add(s.strip())
            except Exception:
              state_obj = {}
              posted = set()

          with open("produtos.json", "r", encoding="utf-8") as f:
            cur_obj = json.load(f)
          cur_list = load_products_from(cur_obj)

          actives = [p for p in cur_list if sku_of(p) and is_active(p)]
          candidates = [p for p in actives if sku_of(p) not in posted]

          candidates.sort(
            key=lambda x: (
              get_recency(x),
              (x.get("title") or x.get("nome") or x.get("name") or "")
            ),
            reverse=True
          )

          print("=== TELEGRAM POSTER (STATEFUL) ===")
          print("MODE:", MODE)
          print("MAX_POSTS:", MAX_POSTS)
          print("Ativos:", len(actives))
          print("Já postados:", len(posted))
          print("Novos (não postados):", len(candidates))

          if MODE == "teste":
            sample = actives[:]
            sample.sort(key=lambda x: get_recency(x), reverse=True)
            if not sample:
              print("Sem produtos ativos para teste.")
              raise SystemExit(0)
            to_post = [sample[0]]
          elif MODE in ("novos", "backfill"):
            to_post = candidates[:MAX_POSTS]
          else:
            print("MODE inválido:", MODE)
            raise SystemExit(1)

          if not to_post:
            print("Nada para postar nesta execução.")
            raise SystemExit(0)

          NOISE = {"mercado livre", "youtube", "tiktok", "threads", "kwai", "reels"}
          BRANDS = {
            "xiaomi", "samsung", "logitech", "philips", "ugreen", "seagate", "arno", "britânia",
            "tapo", "tp-link", "redragon", "oneblade", "sony", "awei", "nescafé", "colgate"
          }

          def is_good_tag(t: str) -> bool:
            t = (t or "").strip()
            if not t:
              return False
            low = t.lower()
            if low in NOISE or low in BRANDS:
              return False
            if len(t) > 22:
              return False
            if re.search(r"\d", t):
              return False
            if re.search(r"[()\/+]", t):
              return False
            return True

          def hashtags(badges):
            out = []
            seen = set()
            for b in badges or []:
              s = (b or "").strip()
              if not is_good_tag(s):
                continue
              key = s.lower()
              if key in seen:
                continue
              seen.add(key)
              tag = re.sub(r"\s+", "_", s)
              tag = re.sub(r"[^A-Za-zÀ-ÖØ-öø-ÿ0-9_]", "", tag)
              if tag:
                out.append("#" + tag)
              if len(out) >= 5:
                break
            return " ".join(out)

          loja = (SITE_BASE.rstrip("/") + "/loja.html") if SITE_BASE else ""
          tagline = "🛒 <b>Link da vitrine na bio</b>"

          posted_now = []
          for p in to_post:
            title = (p.get("title") or p.get("nome") or p.get("name") or "").strip()
            sku = sku_of(p)
            id_busca = (p.get("id_busca") or p.get("idML") or p.get("id") or "").strip()
            link = best_buy(p)
            img = abs_image(p.get("image") or p.get("imagem") or "")

            badges = p.get("badges") or p.get("tags") or []
            if isinstance(badges, str):
              badges = [x.strip() for x in re.split(r"[,;|]", badges) if x.strip()]
            elif not isinstance(badges, list):
              badges = []

            hts = hashtags(badges)
            hts_line = f"\n\n{safe(hts)}" if hts else ""

            loja_line = f"🌐 Loja: {safe(loja)}\n" if loja else ""
            link_line = f"🛒 Link: {safe(link)}\n" if link else ""

            prefix = "🧪 <b>Teste</b>\n" if MODE == "teste" else "👑 <b>Novo Achado</b>\n"

            text = (
              f"{prefix}"
              f"<b>{safe(title) if title else safe(sku)}</b>\n\n"
              f"🔍 ID ML: <code>{safe(id_busca) if id_busca else '—'}</code>\n"
              f"{link_line}"
              f"{loja_line}"
              f"\n{tagline}"
              f"{hts_line}"
            )

            if img.startswith("http"):
              try:
                tg_send_photo(img, text)
              except Exception:
                tg_send_message(text)
            else:
              tg_send_message(text)

            if MODE != "teste":
              posted_now.append(sku)

          if MODE != "teste" and posted_now:
            posted.update(posted_now)
            new_state = {
              "updated_at": datetime.utcnow().isoformat(timespec="seconds") + "Z",
              "posted_count": len(posted),
              "posted": sorted(posted)
            }
            state_path.write_text(json.dumps(new_state, ensure_ascii=False, indent=2), "utf-8")
            print("Estado atualizado:", str(state_path))

          print("Postados nesta execução:", len(posted_now))
          PY

      - name: Commit & push do estado (robusto)
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain)" ]; then
            echo "Sem mudanças no estado."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          ATTEMPT=1
          MAX_ATTEMPTS=3

          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
            echo "=== Push do estado ${ATTEMPT}/${MAX_ATTEMPTS} ==="

            git checkout -B gh-pages
            git add data/telegram_posted.json

            if [ -n "$(git diff --cached --name-only)" ]; then
              git commit -m "telegram: update posted sku state"
            else
              echo "Nada staged para commit nesta tentativa."
            fi

            if git push origin HEAD:gh-pages; then
              echo "Estado enviado com sucesso."
              exit 0
            fi

            echo "Push rejeitado. Fazendo rebase em origin/gh-pages..."
            git fetch origin gh-pages
            git pull --rebase origin gh-pages

            ATTEMPT=$((ATTEMPT + 1))
            sleep 2
          done

          echo "ERRO: não foi possível publicar data/telegram_posted.json após ${MAX_ATTEMPTS} tentativas."
          exit 1
