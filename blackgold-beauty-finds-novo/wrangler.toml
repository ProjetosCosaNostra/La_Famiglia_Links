name = "blackgold-beauty-finds-br"
compatibility_date = "2026-09-20"
pages_build_output_dir = "./dist"

[vars]
APP_NAME = "BlackGold Beauty Finds"
PUBLIC_BASE_URL = "https://blackgold-beauty-finds-br.pages.dev"

[[d1_databases]]
binding = "BG_DB"
database_name = "blackgold-beauty-finds-novo"
database_id = "11111111-1111-4111-8111-111111111111" # local-only placeholder; replace after explicit human approval
migrations_dir = "database/migrations"

[[r2_buckets]]
binding = "BG_MEDIA"
bucket_name = "blackgold-beauty-finds-novo-media"
preview_bucket_name = "blackgold-beauty-finds-novo-media-preview"
