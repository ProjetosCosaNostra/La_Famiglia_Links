<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050403">
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="BlackGold Beauty Finds — experiência premium em construção.">
  <title>BlackGold Beauty Finds — Em construção</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;background:#050403;overflow:hidden}
    body{min-height:100svh;font-family:Arial,sans-serif}
    .stage{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden;background:#050403;isolation:isolate}
    .stage::before{content:"";position:absolute;inset:-34px;z-index:-2;background:url('./under-construction-desktop.webp') center/cover no-repeat;filter:blur(24px) brightness(.42) saturate(1.08);transform:scale(1.08)}
    .stage::after{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(circle at center,transparent 42%,rgba(0,0,0,.42) 100%)}
    picture{display:block;width:100%;height:100%;position:relative;z-index:1}
    picture img{display:block;width:100%;height:100%;object-fit:contain;object-position:center;filter:drop-shadow(0 16px 42px rgba(0,0,0,.48))}
    .sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
    @media (max-width:900px),(orientation:portrait){
      .stage::before{background-image:url('./under-construction-mobile.webp');filter:blur(22px) brightness(.36) saturate(1.05)}
      picture img{object-fit:contain;object-position:center}
    }
    @media (max-width:420px){.stage::before{inset:-24px}}
  </style>
</head>
<body>
  <main class="stage" aria-label="BlackGold Beauty Finds em construção">
    <picture>
      <source media="(max-width:900px), (orientation:portrait)" srcset="./under-construction-mobile.webp">
      <img src="./under-construction-desktop.webp" alt="BlackGold Beauty Finds — Em construção. Voltamos em breve.">
    </picture>
    <h1 class="sr-only">BlackGold Beauty Finds — Em construção</h1>
    <p class="sr-only">Voltamos em breve. Estamos preparando uma experiência premium para você.</p>
  </main>
</body>
</html>
